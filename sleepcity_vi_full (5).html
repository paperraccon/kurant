<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLEEP CITY VI — Форум и Трекер сна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2d78; --magenta:#c026d3; --purple:#7c3aed; --cyan:#22d3ee;
  --orange:#fb923c; --yellow:#facc15; --green:#34d399; --red:#f43f5e;
  --bg:#0b0518; --panel:rgba(22,9,48,.78); --panel2:rgba(34,12,70,.65);
  --border:rgba(255,45,120,.35); --text:#f5e9ff; --muted:#b9a8d9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(124,58,237,.35), transparent 60%),
    radial-gradient(800px 500px at -10% 10%, rgba(255,45,120,.22), transparent 60%),
    radial-gradient(1000px 600px at 50% 110%, rgba(34,211,238,.14), transparent 60%),
    linear-gradient(165deg,#0b0518 0%,#170a33 35%,#2a0a52 65%,#0b0518 100%);
  background-attachment:fixed;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);opacity:.5}
#app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 16px}

/* ===== BANNER ===== */
#banner{position:relative;border-radius:0 0 22px 22px;overflow:hidden;
  background:linear-gradient(180deg,#1b0736 0%,#4c1d95 45%,#a21caf 72%,#ff5e78 100%);
  border:1px solid var(--border);border-top:none;box-shadow:0 0 60px rgba(255,45,120,.35)}
#banner .sun{position:absolute;left:50%;top:34%;width:340px;height:340px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff3b0 0%,#ffb347 35%,#ff5e78 60%,transparent 72%);
  opacity:.55;filter:blur(2px);pointer-events:none}
#banner .grid{position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,45,120,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.5) 1px,transparent 1px);
  background-size:60px 60px;mask-image:linear-gradient(180deg,transparent 40%,black 100%);-webkit-mask-image:linear-gradient(180deg,transparent 40%,black 100%)}
#banner .inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px 26px 30px}
.logo{line-height:1}
.logo .l1{font-family:'Russo One',sans-serif;font-size:clamp(26px,4vw,44px);letter-spacing:.35em;color:#fff;
  text-shadow:0 0 8px #ff2d78,0 0 24px #ff2d78,0 0 60px rgba(255,45,120,.7)}
.logo .l2{display:flex;align-items:baseline;gap:14px;margin-top:2px}
.logo .vi{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
  font-size:clamp(40px,6.5vw,72px);
  background:linear-gradient(180deg,#ffe259 0%,#ff8a3d 40%,#ff2d78 75%,#c026d3 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,45,120,.85))}
.logo .sub{color:#ffe3f1;font-size:13px;letter-spacing:.4em;text-transform:uppercase;opacity:.9;
  text-shadow:0 0 10px rgba(34,211,238,.9)}
.monitor{background:rgba(6,2,16,.8);border:1px solid rgba(34,211,238,.45);border-radius:12px;padding:12px 16px;min-width:230px;
  box-shadow:0 0 18px rgba(34,211,238,.25), inset 0 0 18px rgba(124,58,237,.25);font-size:13px}
.monitor .row{display:flex;justify-content:space-between;gap:14px;color:#c9f4ff}
.monitor .row b{color:#7ef0ff;text-shadow:0 0 8px rgba(34,211,238,.9)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ===== NAV ===== */
#topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 14px;margin-top:14px;border-radius:14px;
  background:rgba(14,5,32,.85);backdrop-filter:blur(10px);border:1px solid var(--border);
  box-shadow:0 4px 30px rgba(192,38,211,.25)}
.navbtn{cursor:pointer;border:1px solid transparent;background:transparent;color:#e9d5ff;
  font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border-radius:9px;transition:.2s}
.navbtn:hover{background:rgba(255,45,120,.15);border-color:var(--border);box-shadow:0 0 14px rgba(255,45,120,.4)}
.navbtn.active{background:linear-gradient(135deg,#ff2d78,#7c3aed);color:#fff;box-shadow:0 0 18px rgba(255,45,120,.65)}
.navbtn .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;box-shadow:0 0 8px rgba(244,63,94,.8)}
#autharea{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;cursor:pointer;
  font-size:14px;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 0 12px rgba(255,45,120,.7)}
#userchip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel)}
#userchip:hover{box-shadow:0 0 14px rgba(255,45,120,.4)}
#userchip .nick{font-weight:600;font-size:13px}

/* ===== COMMON ===== */
h1{font-family:'Russo One',sans-serif;font-size:clamp(22px,3.4vw,34px);margin:26px 0 6px;
  background:linear-gradient(90deg,#7ef0ff,#ff2d78 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,45,120,.5))}
h2{font-family:'Russo One',sans-serif;font-size:19px;margin:18px 0 10px;color:#ffe3f1;text-shadow:0 0 10px rgba(255,45,120,.5)}
.sub-line{color:var(--muted);margin-bottom:16px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;
  box-shadow:0 0 24px rgba(124,58,237,.18), inset 0 0 40px rgba(11,5,24,.4);backdrop-filter:blur(8px)}
.btn{cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;color:#fff;
  font-family:'Inter',sans-serif;background:linear-gradient(135deg,#ff2d78,#7c3aed);
  box-shadow:0 0 14px rgba(255,45,120,.5);transition:.18s;letter-spacing:.03em}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(255,45,120,.85)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,#22d3ee,#2563eb);box-shadow:0 0 14px rgba(34,211,238,.5)}
.btn-cyan:hover{box-shadow:0 0 26px rgba(34,211,238,.85)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#e9d5ff;box-shadow:none}
.btn-ghost:hover{background:rgba(255,45,120,.12);box-shadow:0 0 12px rgba(255,45,120,.35)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#7f1d1d);box-shadow:0 0 14px rgba(244,63,94,.5)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
input,select,textarea{background:rgba(11,5,24,.75);border:1px solid rgba(124,58,237,.5);border-radius:9px;color:#fff;
  padding:10px 12px;font-size:14px;font-family:inherit;width:100%;outline:none;transition:.2s}
input:focus,select,textarea:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 12px rgba(255,45,120,.45)}
input[type="time"]{color-scheme:dark}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.05em;text-transform:uppercase}
.badge{display:inline-block;padding:2px 9px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em}
.badge-admin{background:linear-gradient(135deg,#fbbf24,#b45309);color:#1a0b00;box-shadow:0 0 10px rgba(251,191,36,.6)}
.badge-mod{background:linear-gradient(135deg,#22d3ee,#1d4ed8);color:#04121f;box-shadow:0 0 10px rgba(34,211,238,.6)}
.badge-user{background:rgba(255,45,120,.25);color:#ffd6e7;border:1px solid var(--border)}
.badge-ban{background:linear-gradient(135deg,#f43f5e,#7f1d1d);color:#fff}
.nicklink{cursor:pointer;color:#7ef0ff;font-weight:600;text-decoration:none}
.nicklink:hover{text-shadow:0 0 10px rgba(34,211,238,.9)}
.rep{color:#34d399;font-weight:700;font-size:12px;text-shadow:0 0 8px rgba(52,211,153,.6)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.error{color:#fda4af;font-size:13px;margin-top:8px;min-height:16px}
.ok{color:#6ee7b7;font-size:13px;margin-top:8px;min-height:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 22px;border-radius:12px;
  background:linear-gradient(135deg,#ff2d78,#7c3aed);color:#fff;font-weight:600;box-shadow:0 0 30px rgba(255,45,120,.7);animation:fade 2.4s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:14px;text-align:center}
.stat .num{font-family:'Russo One',sans-serif;font-size:26px;color:#7ef0ff;text-shadow:0 0 14px rgba(34,211,238,.7)}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}

/* ===== XP / LEVEL ===== */
.levelbar{position:relative;height:22px;border-radius:11px;overflow:hidden;background:rgba(11,5,24,.8);border:1px solid var(--border)}
.levelbar .fill{height:100%;border-radius:11px;background:linear-gradient(90deg,#ff2d78,#c026d3,#22d3ee);
  box-shadow:0 0 20px rgba(255,45,120,.8);transition:width .6s;min-width:2%}
.levelbar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.rank{font-family:'Russo One',sans-serif;font-size:20px;
  background:linear-gradient(90deg,#ffe259,#ff2d78,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,45,120,.7))}

/* ===== CALENDAR ===== */
.yearnav{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 18px}
.yearnav .ynum{font-family:'Russo One',sans-serif;font-size:30px;color:#fff;text-shadow:0 0 16px rgba(34,211,238,.8)}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
.month{background:var(--panel2);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:12px}
.month h3{font-family:'Russo One',sans-serif;font-size:14px;color:#ffd6e7;text-align:center;margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
  background:rgba(11,5,24,.6);border:1px solid rgba(124,58,237,.25);color:#cbb8ec;transition:.15s}
.day:hover{border-color:var(--pink);box-shadow:0 0 10px rgba(255,45,120,.55);transform:scale(1.08)}
.day.full{background:linear-gradient(135deg,#c026d3,#ff2d78);color:#fff;box-shadow:0 0 10px rgba(255,45,120,.6);font-weight:700}
.day.part{background:rgba(124,58,237,.5);color:#fff}
.day.today{border:2px solid var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.7)}
.day.empty{visibility:hidden}
.legend{display:flex;gap:18px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ===== FORUM ===== */
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;transition:.2s}
.cat:hover{border-color:var(--pink);box-shadow:0 0 20px rgba(255,45,120,.4)}
.cat .cname{font-family:'Russo One',sans-serif;font-size:16px;color:#7ef0ff}
.topic{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border-radius:10px;
  border:1px solid rgba(124,58,237,.3);background:var(--panel2);margin-bottom:10px;cursor:pointer;transition:.2s}
.topic:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.35)}
.topic .t{font-weight:700;color:#ffe3f1}
.pin{color:var(--yellow);margin-right:6px}
.lock{color:var(--red);margin-right:6px}
.post{background:var(--panel2);border:1px solid rgba(124,58,237,.3);border-radius:12px;padding:14px;margin-bottom:12px}
.post .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.post .pt{white-space:pre-wrap;line-height:1.5}
.likebtn{cursor:pointer;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.12);color:#6ee7b7;border-radius:8px;padding:5px 12px;font-size:13px;transition:.2s}
.likebtn:hover{box-shadow:0 0 12px rgba(52,211,153,.6)}
.likebtn.on{background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 0 12px rgba(52,211,153,.8)}

/* ===== MESSAGES ===== */
.msgs-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:400px}
@media(max-width:820px){.msgs-wrap{grid-template-columns:1fr}}
.dlg{padding:10px 12px;border-radius:10px;border:1px solid rgba(124,58,237,.3);cursor:pointer;margin-bottom:8px;background:var(--panel2)}
.dlg:hover,.dlg.active{border-color:var(--pink);box-shadow:0 0 12px rgba(255,45,120,.4)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:6px}
.bub{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#ff2d78,#c026d3);border-bottom-right-radius:4px;box-shadow:0 0 12px rgba(255,45,120,.45)}
.bub.them{align-self:flex-start;background:var(--panel2);border:1px solid rgba(124,58,237,.5);border-bottom-left-radius:4px}
.bub .tm{display:block;font-size:10px;opacity:.7;margin-top:4px}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(5,1,14,.8);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(160deg,#1d0b3d,#2b0a4e);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:440px;
  box-shadow:0 0 60px rgba(255,45,120,.4)}
.modal h3{font-family:'Russo One',sans-serif;margin-bottom:6px;color:#ffd6e7}
.modal .mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#7ef0ff;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid rgba(124,58,237,.2)}
tr:hover td{background:rgba(255,45,120,.06)}

/* ===== NEWS ===== */
.news{border-left:3px solid var(--pink);padding-left:14px;margin-bottom:18px}
.news .nt{font-family:'Russo One',sans-serif;color:#ffd6e7;margin-bottom:4px}
.news .nd{font-size:11px;color:var(--muted);margin-bottom:6px}

/* ===== MISC ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{cursor:pointer;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid rgba(124,58,237,.4);background:var(--panel2);color:#e9d5ff}
.tab.active{background:linear-gradient(135deg,#22d3ee,#2563eb);color:#fff;box-shadow:0 0 14px rgba(34,211,238,.6)}
pre{background:rgba(5,1,14,.7);border:1px solid rgba(34,211,238,.35);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;color:#7ef0ff;line-height:1.5}
.gta-note{background:rgba(250,146,60,.12);border:1px solid rgba(251,146,60,.4);border-radius:10px;padding:10px 14px;font-size:13px;color:#ffedd5;margin:10px 0}
.big-cta{font-family:'Russo One',sans-serif;font-size:16px;padding:14px 30px;border-radius:12px;letter-spacing:.05em}
footer{margin:40px 0 20px;text-align:center;color:var(--muted);font-size:12px}
footer .flogo{font-family:'Russo One',sans-serif;letter-spacing:.3em;color:#ff2d78;text-shadow:0 0 10px rgba(255,45,120,.6)}

/* статус, контакты, канбан, время */
.statusdot{position:absolute;right:-4px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg)}
.status-awake{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.8)}
.status-sleep{background:var(--purple);box-shadow:0 0 8px rgba(167,139,250,.8)}
.status-dnd{background:var(--red);box-shadow:0 0 8px rgba(244,63,94,.8)}
.statustxt{font-size:13px;color:var(--muted)}
.bio{margin-top:6px;opacity:.9}
.contactchip{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0}
.switch{width:64px;height:32px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;touch-action:none;user-select:none;display:inline-block}
.switch.on{background:linear-gradient(90deg,var(--purple),var(--magenta));box-shadow:0 0 14px rgba(192,38,211,.6)}
.switch .knob{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .knob{left:34px}
.about-card{border-width:2px}
.kanban{display:flex;gap:12px;overflow-x:auto;padding:10px 2px 20px}
.kcol{min-width:220px;flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.khead{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--pink);border-radius:8px;padding:6px 4px 2px}
.kbadge{font-size:12px;padding:3px 10px;border-radius:12px;color:#0b0518;font-weight:700}
.kcount{color:var(--muted);font-size:13px}
.kcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;font-size:14px;cursor:pointer}
.kcard:active{opacity:.7}
.knote{font-size:12px;color:var(--muted);margin-top:4px}
.kpill{display:inline-block;font-size:11px;border:1px solid;border-radius:10px;padding:2px 8px;margin-top:6px}
.kadd{border:1px dashed rgba(255,255,255,.2);border-radius:10px;text-align:center;padding:10px;color:var(--muted);cursor:pointer}
.kadd:hover{color:#fff;border-color:var(--pink)}
.tbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.tbar .tlbl{width:110px;font-size:13px}
.tbar .track{flex:1;height:12px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden}
.tbar .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:8px}
.tbar .val{width:90px;text-align:right;font-size:13px;color:var(--muted)}
.hint-y{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.4);border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#fde68a}
.moncity{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.4)}

/* ====== ПРОФИЛЬ (samp-структура, палитра Вайс-Сити) ====== */
.sp-grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}}
.sp-left,.sp-block{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 0 24px rgba(255,45,120,.12),inset 0 0 30px rgba(124,58,237,.08)}
.sp-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sp-ring{position:relative;width:112px;height:112px;flex:none;margin-bottom:6px}
.sp-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}

<script>
/* ============ КОНФИГ ============ */
const FIREBASE_CONFIG = null; // вставьте сюда firebaseConfig после создания проекта
const ADMIN_EMAIL = 'admin@forum.local';

/* ============ СОСТОЯНИЕ ============ */
let DB = { users:[], cats:[], topics:[], likes:{}, messages:[], news:[], sleep:{} };
let ME = null;
let PAGE = 'home';
let FB = null; // firebase sdk
let FBMODE = false;
let year = new Date().getFullYear();

const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0,10);
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const RANKS = [['Зомби','🧟'],['Куратор дремоты','😴'],['Спящий ученик','🌙'],['Сонный рыцарь','⚔️'],['Мастер пижамы','🛌'],['Хранитель снов','✨'],['Повелитель матраса','👑'],['Сурок-марафонец','🐹'],['Архитектор сновидений','🔮'],['Легенда сна','💫']];

function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ============ БАЗА ДАННЫХ (демо + Firebase) ============ */
const LSKEY='sleepcity_db_v3';
function dbLoadDemo(){ try{ return JSON.parse(localStorage.getItem(LSKEY))||null }catch(e){ return null } }
function dbSaveDemo(){ localStorage.setItem(LSKEY, JSON.stringify(DB)); }

async function fbInit(){
  return new Promise((res)=>{
    const s1=document.createElement('script'); s1.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';
    s1.onload=()=>{ const s2=document.createElement('script'); s2.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js';
      s2.onload=()=>{ const s3=document.createElement('script'); s3.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js';
        s3.onload=()=>{ firebase.initializeApp(FIREBASE_CONFIG); FB={auth:firebase.auth(),db:firebase.firestore()}; FBMODE=true; res(true); };
        s3.onerror=()=>res(false); document.head.appendChild(s3); };
      s2.onerror=()=>res(false); document.head.appendChild(s2); };
    s1.onerror=()=>res(false); document.head.appendChild(s1);
  });
}

async function loadState(){
  if(!FBMODE){ return; }
  try{
    const fm = await FB.db.collection('forum').doc('main').get();
    if(fm.exists){ const d=fm.data(); DB.cats=d.cats||[]; DB.topics=d.topics||[]; DB.likes=d.likes||{}; DB.messages=d.messages||[]; DB.news=d.news||[]; }
    const us = await FB.db.collection('users').get();
    DB.users = us.docs.map(x=>({id:x.id, ...x.data()}));
    const sl = await FB.db.collection('sleep').get();
    DB.sleep = {}; sl.docs.forEach(x=>{ DB.sleep[x.id] = x.data().rec||{} });
  }catch(e){ console.warn(e); }
}
async function saveForum(){ if(!FBMODE){ dbSaveDemo(); return; } await FB.db.collection('forum').doc('main').set({cats:DB.cats,topics:DB.topics,likes:DB.likes,messages:DB.messages,news:DB.news}); }
async function saveUsers(){ if(!FBMODE){ dbSaveDemo(); return; } for(const u of DB.users){ await FB.db.collection('users').doc(u.id).set({email:u.email,nick:u.nick,role:u.role,banned:!!u.banned,privacy:!!u.privacy,createdAt:u.createdAt||Date.now(),city:u.city||'',status:u.status||'awake',bio:u.bio||'',contacts:u.contacts||[],about:u.about||null,timeLogs:u.timeLogs||[],siteSec:u.siteSec||0}); } }
async function saveSleep(uidv){ if(!FBMODE){ dbSaveDemo(); return; } await FB.db.collection('sleep').doc(uidv).set({rec:DB.sleep[uidv]||{}}); }

/* ============ XP И СТАТИСТИКА ============ */
function sleepHours(rec){
  if(!rec||!rec.s||!rec.w) return null;
  const [sh,sm]=rec.s.split(':').map(Number), [wh,wm]=rec.w.split(':').map(Number);
  let dur=(wh*60+wm)-(sh*60+sm); if(dur<=0) dur+=1440;
  return dur/60;
}
function xpForNight(rec){
  const h=sleepHours(rec); if(h==null) return 0;
  let xp = h>=8 ? 1 : Math.max(0,(h-4)*0.25);
  const [sh,sm]=rec.s.split(':').map(Number); const mins=sh*60+sm;
  const late=mins-(23*60+30);
  if(late>0) xp-=Math.floor(late/60)*0.5;
  if(h>10) xp-=(h-10)*0.15;
  return Math.max(0, Math.round(Math.min(1,xp)*100)/100);
}
function userXp(uidv){ const recs=(DB.sleep[uidv]||{}); let xp=0; for(const k in recs){ xp+=xpForNight(recs[k]); } return Math.round(Math.min(30,xp)*100)/100; }
function levelOf(xp){ return Math.min(9, Math.floor(xp/3)); }
function repOf(uidv){ let r=0; for(const pid in DB.likes){ if(DB.likes[pid].includes(uidv)) r++; } return r; }
function statsOf(uidv){
  const recs=DB.sleep[uidv]||{}; const days=Object.keys(recs).length;
  if(!days) return {days:0,avg:0,streak:0,week7:0,perfect:0};
  let sum=0,n=0,perfect=0,week7=0;
  for(const k in recs){ const h=sleepHours(recs[k]); if(h==null) continue; sum+=h; n++; if(h>=8&&xpForNight(recs[k])>=1) perfect++; if(h>=7) week7++; }
  const avg=n?sum/n:0;
  // серия: подряд идущие дни с записями, начиная с сегодня или вчера
  let streak=0; const d=new Date(); if(!recs[todayStr()]) d.setDate(d.getDate()-1);
  while(recs[d.toISOString().slice(0,10)]){ streak++; d.setDate(d.getDate()-1); }
  return {days,avg,streak,week7,perfect};
}

/* ============ АВТОРИЗАЦИЯ ============ */
function findUserByEmail(e){ return DB.users.find(u=>u.email.toLowerCase()===String(e).toLowerCase()); }
function findUserByNick(n){ return DB.users.find(u=>u.nick.toLowerCase()===String(n).trim().toLowerCase()); }

async function doRegister(){
  const nick=document.getElementById('rg-nick').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const pass=document.getElementById('rg-pass').value;
  const err=document.getElementById('rg-err');
  err.textContent='';
  if(nick.length<3) return err.textContent='Никнейм — минимум 3 символа';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent='Некорректный email';
  if(pass.length<6) return err.textContent='Пароль — минимум 6 символов';
  if(findUserByEmail(email)) return err.textContent='Такой email уже зарегистрирован';
  if(findUserByNick(nick)) return err.textContent='Такой никнейм уже занят';
  if(FBMODE){
    try{
      const cred=await FB.auth.createUserWithEmailAndPassword(email,pass);
      const role = email.toLowerCase()===ADMIN_EMAIL ? 'admin':'user';
      const u={id:cred.user.uid,email,nick,role,banned:false,privacy:false,createdAt:Date.now()};
      DB.users.push(u); await saveUsers(); ME=u; closeModal(); renderAll(); toast('Добро пожаловать в Вайс-Сити, '+nick+'!');
    }catch(e){ err.textContent='Ошибка Firebase: '+e.message; }
  }else{
    const role = email.toLowerCase()===ADMIN_EMAIL ? 'admin':'user';
    const u={id:uid(),email,nick,pass,role,banned:false,privacy:false,createdAt:Date.now()};
    DB.users.push(u); dbSaveDemo(); ME=u; try{ sessionStorage.setItem('sc_session',u.id); }catch(e){}
    closeModal(); renderAll(); toast('Аккаунт создан! Демо-режим: данные только в этом браузере');
  }
}
async function doLogin(){
  const email=document.getElementById('lg-email').value.trim();
  const pass=document.getElementById('lg-pass').value;
  const err=document.getElementById('lg-err'); err.textContent='';
  if(FBMODE){
    try{
      const cred=await FB.auth.signInWithEmailAndPassword(email,pass);
      await ensureUserDoc(cred.user,email);
      closeModal(); await afterAuth(cred.user.uid);
    }catch(e){ err.textContent='Ошибка входа: '+e.message; }
  }else{
    const u=findUserByEmail(email);
    if(!u||u.pass!==pass) return err.textContent='Неверный email или пароль';
    if(u.banned) return err.textContent='Аккаунт заблокирован администратором';
    ME=u; try{ sessionStorage.setItem('sc_session',u.id); }catch(e){}
    dbSaveDemo(); closeModal(); renderAll(); toast('С возвращением, '+u.nick+'!');
  }
}
async function ensureUserDoc(fu,email){
  const doc=await FB.db.collection('users').doc(fu.uid).get();
  if(!doc.exists){
    let nick='Игрок'+fu.uid.slice(0,5);
    const u={id:fu.uid,email,nick,role:email.toLowerCase()===ADMIN_EMAIL?'admin':'user',banned:false,privacy:false,createdAt:Date.now()};
    DB.users.push(u); await saveUsers();
  }else{
    const d=doc.data();
    if(!DB.users.find(x=>x.id===fu.uid)) DB.users.push({id:fu.uid,...d});
  }
  const me=DB.users.find(x=>x.id===fu.uid);
  if(email.toLowerCase()===ADMIN_EMAIL && me.role!=='admin'){ me.role='admin'; await saveUsers(); }
}
async function afterAuth(fuid){
  ME=DB.users.find(x=>x.id===fuid)||null;
  if(ME&&ME.banned){ FB.auth.signOut(); ME=null; alert('Ваш аккаунт заблокирован'); }
  await loadState(); renderAll();
}
async function logout(){ ME=null; try{ sessionStorage.removeItem('sc_session'); }catch(e){} if(FBMODE){ await FB.auth.signOut(); } renderAll(); toast('Вы вышли из аккаунта'); }

/* ============ МОДАЛКИ ============ */
function modal(html){ document.getElementById('modal-root').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function authModal(kind){
  if(kind==='login'){ modal(
    '<h3>🌙 Вход в Вайс-Сити</h3><p class="muted">Покажи, что ты легенда сна</p>'+
    '<label>Email</label><input id="lg-email" type="email" placeholder="vice@night.vc">'+
    '<label>Пароль</label><input id="lg-pass" type="password" placeholder="••••••••">'+
    '<div class="error" id="lg-err"></div><div class="modal-actions">'+
    '<button class="btn" onclick="doLogin()">Войти</button>'+
    (FBMODE?'<button class="btn-ghost btn" onclick="resetPass()">Забыли пароль?</button>':'')+
    '<button class="btn-ghost btn" onclick="authModal(\'register\')">Регистрация</button></div>'+
    '<div class="hint-y" id="lg-hint"></div>');
    setTimeout(fillLoginHint,50); }
  else modal(
    '<h3>🌆 Регистрация</h3><p class="muted">Создай свой профиль жителя Вайс-Сити</p>'+
    '<label>Никнейм</label><input id="rg-nick" placeholder="TommyVercetti">'+
    '<label>Email</label><input id="rg-email" type="email" placeholder="vice@night.vc">'+
    '<label>Пароль</label><input id="rg-pass" type="password" placeholder="минимум 6 символов">'+
    '<div class="error" id="rg-err"></div><div class="modal-actions">'+
    '<button class="btn" onclick="doRegister()">Создать аккаунт</button>'+
    '<button class="btn-ghost btn" onclick="authModal(\'login\')">У меня уже есть аккаунт</button></div>');
}
async function resetPass(){ const e=document.getElementById('lg-email').value.trim(); if(!e) return; try{ await FB.auth.sendPasswordResetEmail(e); toast('Письмо для сброса отправлено'); }catch(err){ toast(err.message); } }

/* ============ НАВИГАЦИЯ ============ */
const NAVS=[['home','🏠 Главное меню'],['tracker','🌙 Трекер сна'],['forum','💬 Форум'],['guest','👻 Сон игрока'],['msgs','✉️ Сообщения'],['about','👤 Обо мне']];
function navHtml(){
  let h='';
  for(const [id,name] of NAVS){
    let badge='';
    if(id==='msgs'&&ME){ const n=unreadCount(); if(n>0) badge='<span class="badge">'+n+'</span>'; }
    h+='<button class="navbtn'+(PAGE===id?' active':'')+'" onclick="showPage(\''+id+'\')">'+name+badge+'</button>';
  }
  if(ME&&ME.role==='admin') h+='<button class="navbtn'+(PAGE==='admin'?' active':'')+'" style="color:#fbbf24" onclick="showPage(\'admin\')">🛠 Админ</button>';
  return h;
}
function authAreaHtml(){
  if(!ME) return '<button class="btn btn-ghost btn-sm" onclick="authModal(\'login\')">Войти</button><button class="btn btn-sm" onclick="authModal(\'register\')">Регистрация</button>';
  const ini=esc(ME.nick[0].toUpperCase());
  return '<div id="userchip" onclick="chipMenu()"><span class="avatar">'+ini+'</span><span class="nick">'+esc(ME.nick)+'</span></div>';
}
function chipMenu(){
  modal('<h3>👤 '+esc(ME.nick)+'</h3><div class="muted">'+esc(ME.email)+'</div><div style="margin-top:10px">'+
    '<span class="badge badge-'+ME.role+'">'+roleName(ME.role)+'</span> <span class="rep">REP '+repOf(ME.id)+'</span></div>'+
    '<div class="modal-actions"><button class="btn-cyan btn" onclick="closeModal();showPage(\'profile\',\''+ME.id+'\')">Мой профиль</button>'+
    '<button class="btn-ghost btn" onclick="closeModal();showPage(\'time\')">⏱ Моё время</button>'+
    '<button class="btn-ghost btn" onclick="closeModal();showPage(\'about\')">👤 Обо мне</button>'+
    '<button class="btn-danger btn" onclick="logout()">Выйти</button></div>');
}
function roleName(r){ return r==='admin'?'АДМИН':r==='mod'?'МОДЕР':'ИГРОК'; }
function showPage(id,param){ PAGE=id; PAGEPARAM=param||null; window.scrollTo(0,0); renderPage(); }
let PAGEPARAM=null;

function renderNav(){
  document.getElementById('navbtns').innerHTML=navHtml();
  document.getElementById('autharea').innerHTML=authAreaHtml();
  const mon=document.getElementById('mon-online');
  if(mon){ const on=onlineUsers(); mon.textContent=on.length?on.length:'—'; }
  const mc=document.getElementById('mon-city');
  if(mc){
    const cities=[...new Set(onlineUsers().map(u=>u.city).filter(Boolean))];
    if(!cities.length){ mc.innerHTML=(ME&&!ME.city)?'<span class="moncity" onclick="askCity()">📍 указать город</span>':'—'; }
    else mc.textContent=cities.join(', ');
  }
}
function renderPage(){
  const p=document.getElementById('page');
  if(PAGE==='tracker'&&!ME){ p.innerHTML=gateHtml('Трекер сна'); return; }
  if(PAGE==='msgs'&&!ME){ p.innerHTML=gateHtml('Сообщения'); return; }
  if(PAGE==='admin'&&(!ME||ME.role!=='admin')){ p.innerHTML=gateHtml('Админ-панель'); return; }
  if(PAGE==='about'&&!ME){ p.innerHTML=gateHtml('Обо мне'); return; }
  if(PAGE==='time'&&!ME){ p.innerHTML=gateHtml('Моё время'); return; }
  if(PAGE==='home') renderHome(p);
  else if(PAGE==='tracker') renderTracker(p,PAGEPARAM);
  else if(PAGE==='forum') renderForum(p);
  else if(PAGE==='guest') renderGuest(p);
  else if(PAGE==='msgs') renderMsgs(p);
  else if(PAGE==='profile') renderProfile(p,PAGEPARAM);
  else if(PAGE==='admin') renderAdmin(p);
  else if(PAGE==='about') renderAbout(p,PAGEPARAM);
  else if(PAGE==='time') renderTime(p,PAGEPARAM);
}
function gateHtml(what){
  return '<div class="card" style="text-align:center;padding:50px 20px"><h1 style="margin-top:0">'+esc(what)+'</h1>'+
  '<p class="sub-line">Эта зона Вайс-Сити только для своих. Войдите или зарегистрируйтесь.</p>'+
  '<div class="row" style="justify-content:center"><button class="btn big-cta" onclick="authModal(\'login\')">Войти</button>'+
  '<button class="btn btn-cyan big-cta" onclick="authModal(\'register\')">Регистрация</button></div></div>';
}

    '<span class="ynum">'+year+'</span>'+
    '<button class="btn btn-ghost btn-sm" onclick="year++;renderPage()">'+(year+1)+' ›</button></div>'+
    '<div class="months">'+monthsHtml+'</div>'+
    '<div class="legend"><span><span class="sw" style="background:linear-gradient(135deg,#c026d3,#ff2d78)"></span>полная запись</span>'+
    '<span><span class="sw" style="background:rgba(124,58,237,.5)"></span>неполная запись</span>'+
    '<span><span class="sw" style="border:2px solid #22d3ee"></span>сегодня</span></div></div>'+

function setChartMode(days){ window.chartDays=days; document.getElementById('tab30').classList.toggle('active',days===30);
  document.getElementById('tab365').classList.toggle('active',days===365); drawChart(PAGEPARAM||ME.id); }
function monthHtml(y,m,recs,readOnly){
  const first=new Date(y,m,1); let skip=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate(); let cells='';
  for(let i=0;i<skip;i++) cells+='<span class="day empty"></span>';
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec=recs[ds]; const isToday=ds===todayStr();
    let cls='day'; if(rec&&rec.s&&rec.w) cls+=' full'; else if(rec) cls+=' part'; if(isToday) cls+=' today';
    cells+='<span class="'+cls+'" onclick="dayClick(\''+ds+'\','+(readOnly?'true':'false')+')">'+d+'</span>';
  }
  return '<div class="month"><h3>'+MONTHS[m]+' '+y+'</h3><div class="dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days">'+cells+'</div></div>';
}
function dayClick(ds,readOnly){
  const uidv=PAGEPARAM||ME.id;
  const rec=(DB.sleep[uidv]||{})[ds]||{};
  if(readOnly){
    const h=sleepHours(rec);
    modal('<h3>📅 '+ds+'</h3>'+(rec.s||rec.w?
      '<p>Отбой: <b>'+(rec.s||'—')+'</b><br>Подъём: <b>'+(rec.w||'—')+'</b><br>Сон: <b>'+(h?h.toFixed(1)+' ч':'—')+'</b> • XP: <b>'+xpForNight(rec)+'</b></p>'
      :'<p class="muted">В этот день записей нет</p>')+
      '<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>');
    return;
  }
  modal('<h3>📅 '+ds+'</h3><p class="muted">Отметь свой сон, легенда</p>'+
    '<div class="mrow"><div><label>🌙 Лёг спать</label><input type="time" id="sl-s" value="'+(rec.s||'')+'"></div>'+
    '<div><label>☀️ Проснулся</label><input type="time" id="sl-w" value="'+(rec.w||'')+'"></div></div>'+
    '<div class="modal-actions"><button class="btn" onclick="saveDay(\''+ds+'\')">💾 Сохранить</button>'+
    '<button class="btn-danger btn" onclick="delDay(\''+ds+'\')">🗑 Удалить</button>'+
    '<button class="btn-ghost btn" onclick="closeModal()">Закрыть</button></div>');
}
async function saveDay(ds){
  const uidv=PAGEPARAM||ME.id;
  if(!DB.sleep[uidv]) DB.sleep[uidv]={};
  DB.sleep[uidv][ds]={s:document.getElementById('sl-s').value,w:document.getElementById('sl-w').value};
  await saveSleep(uidv); closeModal(); renderPage(); toast('Записано! Сон на '+ds);

async function delDay(ds){

async function clearYear(){
  const uidv=PAGEPARAM||ME.id;
  if(!confirm('Удалить все записи за '+year+' год?')) return;
  if(DB.sleep[uidv]) for(const k of Object.keys(DB.sleep[uidv])) if(k.startsWith(year+'-')) delete DB.sleep[uidv][k];
  await saveSleep(uidv); renderPage(); toast('Год очищен');
}
function exportCSV(){
  const uidv=PAGEPARAM||ME.id; const recs=DB.sleep[uidv]||{};
  let csv='Дата;Лёг спать;Проснулся;Часов сна;XP\n';
  for(const k of Object.keys(recs).sort()){ const r=recs[k]; const h=sleepHours(r);
    csv+=k+';'+(r.s||'')+';'+(r.w||'')+';'+(h?h.toFixed(2):'')+';'+xpForNight(r)+'\n'; }
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sleep_'+year+'.csv'; a.click(); toast('CSV сохранён');
}

/* ============ ДИАГРАММА ============ */
function drawChart(uidv){
  const cv=document.getElementById('chart'); if(!cv) return;
  const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=300;
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const recs=DB.sleep[uidv]||{}; const mode=window.chartDays||30;
  let data=[];
  if(mode===30){ for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    const h=sleepHours(recs[ds]); data.push({label:ds.slice(5),h,s:recs[ds]?recs[ds].s:null}); } }
  else{ const ym=String(year); for(let m=0;m<12;m++){ let sum=0,n=0;
    for(let d=1;d<=31;d++){ const ds=ym+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); if(!recs[ds]) continue; const h=sleepHours(recs[ds]); if(h==null) continue; sum+=h; n++; }
    data.push({label:MONTHS[m].slice(0,3),h:n?sum/n:null,n}); } }
  const maxH=Math.max(10,...data.map(d=>d.h||0),9)+1;
  const padL=34,padB=28,padT=16,plotW=W-padL-10,plotH=H-padT-padB;
  // сетка
  ctx.strokeStyle='rgba(124,58,237,.3)'; ctx.fillStyle='#b9a8d9'; ctx.font='10px Inter'; ctx.textAlign='right';
  const stepH=Math.ceil(maxH/5);
  for(let g=0;g<=5;g++){ const v=g*stepH; const y=padT+plotH-(v/maxH)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-10,y); ctx.stroke(); ctx.fillText(v+'ч',padL-6,y+3); }
  // линия нормы 8ч
  const ny=padT+plotH-(8/maxH)*plotH;
  ctx.strokeStyle='rgba(255,45,120,.9)'; ctx.setLineDash([6,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(padL,ny); ctx.lineTo(W-10,ny); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,45,120,.9)'; ctx.textAlign='left'; ctx.fillText('норма 8ч',padL+4,ny-5);
  // столбики
  const bw=plotW/data.length;
  data.forEach((d,i)=>{
    if(d.h==null) return;
    const x=padL+i*bw+bw*0.15, w=bw*0.7;
    const bh=(d.h/maxH)*plotH, y=padT+plotH-bh;
    const grad=ctx.createLinearGradient(0,y,0,y+bh);
    if(d.h>=8){ grad.addColorStop(0,'#34d399'); grad.addColorStop(1,'rgba(52,211,153,.25)'); }
    else if(d.h>=7){ grad.addColorStop(0,'#facc15'); grad.addColorStop(1,'rgba(250,204,21,.25)'); }
    else{ grad.addColorStop(0,'#f43f5e'); grad.addColorStop(1,'rgba(244,63,94,.25)'); }
    ctx.fillStyle=grad; ctx.shadowColor=d.h>=8?'rgba(52,211,153,.8)':d.h>=7?'rgba(250,204,21,.8)':'rgba(244,63,94,.8)'; ctx.shadowBlur=8;
    ctx.beginPath(); if(ctx.roundRect){ ctx.roundRect(x,y,w,bh,4); ctx.fill(); } else { ctx.fillRect(x,y,w,bh); } ctx.shadowBlur=0;
    // подписи
    if(mode===30){ if(data.length>15?(i%5===0):true){ ctx.fillStyle='#b9a8d9'; ctx.textAlign='center'; ctx.font='9px Inter'; ctx.fillText(d.label,x+w/2,H-8); } }
    else{ ctx.fillStyle='#b9a8d9'; ctx.textAlign='center'; ctx.font='10px Inter'; ctx.fillText(d.label,x+w/2,H-8); }
  });
  // тултип по клику
  cv.onclick=(ev)=>{
    const rect=cv.getBoundingClientRect(); const mx=ev.clientX-rect.left;
    const i=Math.floor((mx-padL)/bw);
    if(i<0||i>=data.length||data[i].h==null) return;
    const d=data[i];
    toast(d.label+': сон '+(mode===30?'':'в среднем ')+' '+d.h.toFixed(1)+' ч'+(d.s?' (отбой '+d.s+')':''));
  };
}
</script>

function renderTopicPage(p,tid){

      (canEdit?'<button class="btn-ghost btn btn-sm" onclick="F_EDIT=\''+po.id+'\';renderPage()">✏ Изменить</button><button class="btn-danger btn btn-sm" onclick="delPost(\''+t.id+'\',\''+po.id+'\')">🗑 Удалить</button>':'')+

async function replyTopic(tid){
  const t=DB.topics.find(x=>x.id===tid); const txt=document.getElementById('np-text').value.trim();
  if(!txt) return toast('Сообщение пустое');
  t.posts.push({id:uid(),author:ME.id,text:txt,time:Date.now()}); await saveForum(); renderPage();
}
async function likePost(tid,pid){
  if(!DB.likes[pid]) DB.likes[pid]=[];
  const i=DB.likes[pid].indexOf(ME.id);
  if(i>=0) DB.likes[pid].splice(i,1); else DB.likes[pid].push(ME.id);
  await saveForum(); renderPage();
}
async function saveEdit(tid,pid){
  const t=DB.topics.find(x=>x.id===tid); const po=t.posts.find(x=>x.id===pid);
  po.text=document.getElementById('ep-text').value.trim(); po.edited=true; await saveForum(); F_EDIT=null; renderPage(); toast('Изменено');
}
async function delPost(tid,pid){
  if(!confirm('Удалить сообщение?')) return;
  const t=DB.topics.find(x=>x.id===tid); t.posts=t.posts.filter(x=>x.id!==pid); delete DB.likes[pid];
  await saveForum(); renderPage();
}
async function pinTopic(tid){ const t=DB.topics.find(x=>x.id===tid); t.pinned=!t.pinned; await saveForum(); renderPage(); }
async function lockTopic(tid){ const t=DB.topics.find(x=>x.id===tid); t.locked=!t.locked; await saveForum(); renderPage(); }
async function delTopic(tid){
  if(!confirm('Удалить тему целиком?')) return;
  DB.topics=DB.topics.filter(x=>x.id!==tid); await saveForum(); forumHome(); toast('Тема удалена');
}

/* ============ СООБЩЕНИЯ ============ */
function renderMsgs(p,target){
  if(target) return renderThread(p,target);
  const mine=DB.messages.filter(m=>m.from===ME.id||m.to===ME.id);
  const partners=[...new Set(mine.map(m=>m.from===ME.id?m.to:m.from))];
  let dl='';
  if(partners.length===0) dl='<p class="muted">Диалогов нет. Напиши кому-нибудь первым!</p>';
  for(const pid of partners){
    const u=DB.users.find(x=>x.id===pid); if(!u) continue;
    const last=mine.filter(m=>(m.from===pid&&m.to===ME.id)||(m.from===ME.id&&m.to===pid)).sort((a,b)=>b.time-a.time)[0];
    const unread=mine.filter(m=>m.from===pid&&m.to===ME.id&&!m.read).length;
    dl+='<div class="dlg" onclick="showPage(\'msgs\',\''+pid+'\')"><b>'+esc(u.nick)+'</b> <span class="badge badge-'+u.role+'">'+roleName(u.role)+'</span>'+(unread?' <span class="badge" style="background:var(--red)">'+unread+'</span>':'')+
      '<div class="muted" style="margin-top:4px">'+(last?esc(last.text.slice(0,40)):'' )+'</div></div>';
  }
  p.innerHTML='<h1>✉️ Сообщения</h1><p class="sub-line">Приватные переговоры Вайс-Сити</p>'+
    '<div class="msgs-wrap"><div class="card"><h2>Диалоги</h2>'+dl+
    '<div style="margin-top:14px"><label>Написать по никнейму</label><div class="row"><input id="dm-nick" placeholder="Никнейм" style="flex:1"><button class="btn btn-sm" onclick="startByNick()">Начать</button></div></div></div>'+
    '<div class="card" style="display:flex;align-items:center;justify-content:center"><p class="muted">Выбери диалог слева</p></div></div>';
}
function startByNick(){
  const n=document.getElementById('dm-nick').value.trim();
  const u=findUserByNick(n);
  if(!u) return toast('Игрок не найден');
  if(u.id===ME.id) return toast('Себе писать не обязательно, ты и так знаешь, что скажешь');
  showPage('msgs',u.id);
}
function renderThread(p,pid){
  const u=DB.users.find(x=>x.id===pid); if(!u){ showPage('msgs'); return; }
  const conv=DB.messages.filter(m=>(m.from===ME.id&&m.to===pid)||(m.from===pid&&m.to===ME.id)).sort((a,b)=>a.time-b.time);
  conv.forEach(m=>{ if(m.to===ME.id&&!m.read){ m.read=true; } });
  saveForum();
  let bubbles='';
  if(conv.length===0) bubbles='<p class="muted">Сообщений пока нет. Начни разговор первым.</p>';
  for(const m of conv) bubbles+='<div class="bub '+(m.from===ME.id?'me':'them')+'">'+esc(m.text)+'<span class="tm">'+new Date(m.time).toLocaleString('ru-RU')+'</span></div>';
  p.innerHTML='<div class="row"><button class="btn btn-ghost btn-sm" onclick="showPage(\'msgs\')">← Все диалоги</button></div><div style="height:12px"></div>'+
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div><b style="font-size:17px">'+esc(u.nick)+'</b> <span class="badge badge-'+u.role+'">'+roleName(u.role)+'</span> <span class="rep">REP '+repOf(u.id)+'</span></div>'+
    '<button class="btn btn-ghost btn-sm" onclick="showPage(\'profile\',\''+u.id+'\')">Профиль</button></div>'+
    '<div class="chat" id="chatbox">'+bubbles+'</div>'+
    '<div class="row" style="margin-top:12px"><input id="dm-text" placeholder="Сообщение..." style="flex:1" onkeydown="if(event.key===\'Enter\')sendMsg(\''+pid+'\')"><button class="btn" onclick="sendMsg(\''+pid+'\')">➤</button></div></div>';
  const cb=document.getElementById('chatbox'); if(cb) cb.scrollTop=cb.scrollHeight;
}
async function sendMsg(pid){
  const txt=document.getElementById('dm-text').value.trim(); if(!txt) return;
  DB.messages.push({id:uid(),from:ME.id,to:pid,text:txt,time:Date.now(),read:false});
  await saveForum(); renderThread(document.getElementById('page'),pid);
}
</script>

function appIcon(nm){

  if(n.includes('теле')||n.includes('telegram')) return '✈️';
  if(n.includes('инст')||n.includes('inst')) return '📷';
  if(n.includes('диск')||n.includes('disc')) return '🎮';
  if(n.includes('стим')||n.includes('steam')) return '🕹';
  if(n.includes('книг')) return '📚';
  if(n.includes('игр')) return '🎯';
  if(n.includes('вк')) return '🎧';
  return '📱';
}

function askCity(force){
  if(!ME) return toast('Сначала войдите в аккаунт');
  if(ME.city&&!force) return toast('Город уже указан: '+ME.city+'. Изменить — кнопка в профиле.');
  if(!navigator.geolocation) return manualCity();
  toast('Определяем ваш город…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const c=await lookupCity(pos.coords.latitude,pos.coords.longitude);
    if(c) saveCity(c); else manualCity();
  },()=>manualCity(),{timeout:8000});
}
async function lookupCity(lat,lon){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lon+'&zoom=10&accept-language=ru');
    const j=await r.json(); const a=j.address||{};
    return a.city||a.town||a.village||a.state||null;
  }catch(e){ return null; }
}

  modal('<h3>📍 Ваш город</h3><p class="muted">Геолокация недоступна — напишите город вручную</p>'+

function aboutFiltered(ab,type){
  let its=(ab[type]||[]).slice();
  const q=(ABOUT_Q||'').toLowerCase();
  if(q) its=its.filter(x=>(x.title+' '+(x.note||'')+' '+(x.tags||[]).join(' ')).toLowerCase().includes(q));
  if(ABOUT_PRIO) its=its.filter(x=>x.prio===ABOUT_PRIO);
  if(ABOUT_TAG) its=its.filter(x=>(x.tags||[]).includes(ABOUT_TAG));
  if(ABOUT_OVER) its=its.filter(x=>x.due&&new Date(x.due+'T23:59')<new Date());
  return its;
}

async function aboutSaveItem(type,id){
  const title=document.getElementById('ki-title').value.trim();
  if(!title) return toast('Введите название');
  const col=+document.getElementById('ki-col').value;
  const prio=document.getElementById('ki-prio').value;
  const due=document.getElementById('ki-due').value;
  const plan=+document.getElementById('ki-plan').value||0;
  const mins=+document.getElementById('ki-mins').value||0;
  const tags=document.getElementById('ki-tags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const newChecks=document.getElementById('ki-check').value.split(',').map(s=>s.trim()).filter(Boolean);
  const note=document.getElementById('ki-note').value.trim();
  ME.about[type]=ME.about[type]||[];
  const upd=Date.now();
  if(id){ const it=ME.about[type].find(x=>x.id===id);
    if(it){
      Object.assign(it,{title,col,prio,due,plan,mins,tags,note,upd});
      it.check=it.check||[];
      newChecks.forEach(ct=>{ if(!it.check.some(c=>c.t===ct)) it.check.push({t:ct,done:false}); });
    } }
  else ME.about[type].push({id:uid(),title,col,prio,due,plan,mins,tags,note,check:newChecks.map(tt=>({t:tt,done:false})),ts:Date.now(),upd});
  await saveUsers(); closeModal(); renderPage(); toast('Сохранено');
}
async function aboutToggleCheck(type,id,idx){
  const it=ME.about[type].find(x=>x.id===id); if(!it) return;
  it.check[idx].done=!it.check[idx].done; it.upd=Date.now();
  await saveUsers(); aboutItemModal(type,0,id);
}

async function aboutDelItem(type,id){
  ME.about[type]=(ME.about[type]||[]).filter(x=>x.id!==id);
  await saveUsers(); closeModal(); renderPage(); toast('Удалено');
}
function aboutTableHtml(ab,type,isMe){

  its.sort((a,b)=>{const va=F[ABOUT_SORT.f](a),vb=F[ABOUT_SORT.f](b);return (va<vb?-1:va>vb?1:0)*ABOUT_SORT.dir;});
  if(!its.length) return '<p class="muted">Ничего не найдено по фильтрам.</p>';

  return '<table class="ktable"><tr>'+th('title','Название')+th('col','Статус')+th('prio','Приоритет')+th('due','Дедлайн')+th('minsk','Время')+th('upd','Изменено')+'<th>Чек-лист</th><th>Теги</th></tr>'+
  its.map(x=>{
    const pi={h:['kprio-h','🔴 Высокий'],m:['kprio-m','🟡 Средний'],l:['kprio-l','🟢 Низкий']}[x.prio];
    const ctot=(x.check||[]).length, cdone=x.check?x.check.filter(c=>c.done).length:0;
    return '<tr'+(isMe?' style="cursor:pointer" onclick="aboutItemModal(\''+type+'\',0,\''+x.id+'\')"':'')+'><td><b>'+esc(x.title)+'</b>'+(x.note?'<div class="muted" style="font-size:12px">'+esc(x.note)+'</div>':'')+'</td>'+

    '<td>'+((x.mins||x.plan)?fmtH(x.mins||0)+(x.plan?' / '+fmtH(x.plan):''):'—')+'</td>'+

  }).join('')+'</table>';

  const sid=sessionStorage.getItem('sc_session'); if(sid){ const u=DB.users.find(x=>x.id===sid); if(u&&!u.banned) ME=u; }
  presenceInit(); siteTimeInit();
  if(ME&&!ME.city&&!sessionStorage.getItem('sc_city_asked')){ sessionStorage.setItem('sc_city_asked','1'); setTimeout(askCity,800); }
  renderAll();
}
init();
</script>
