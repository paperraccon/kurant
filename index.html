<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курант RP: викторина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8E1;--surface:#FFFFFF;--ink:#15181C;--muted:#566070;--line:#C9CFC6;
  --green:#1F7A33;--money:#2E7D1E;--red:#C62828;--yellow:#B07A00;--blue:#1F5FBF;--on:#FFFFFF;--chat:#1A1D21;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317;--surface:#1A1F26;--ink:#EDF1F5;--muted:#9AA5B3;--line:#2B333D;
    --green:#4CC265;--money:#7BD24A;--red:#FF6B5E;--yellow:#F2B93B;--blue:#6EA2FF;--on:#0B0E11;--chat:#0B0D10;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317;--surface:#1A1F26;--ink:#EDF1F5;--muted:#9AA5B3;--line:#2B333D;
  --green:#4CC265;--money:#7BD24A;--red:#FF6B5E;--yellow:#F2B93B;--blue:#6EA2FF;--on:#0B0E11;--chat:#0B0D10;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
h1,h2,.hud,.btn{font-family:"Russo One","Arial Black",system-ui,sans-serif;font-weight:400}
h1{font-size:34px;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 20px}
[hidden]{display:none!important}
.hero{display:grid;gap:10px}
.card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit}
.card:hover{border-color:var(--green)}
.av{font-size:34px;width:56px;height:56px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.card b{font-family:"Russo One",system-ui,sans-serif;font-weight:400;font-size:19px;display:block}
.card span{color:var(--muted);font-size:14px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:20px;margin-bottom:10px}
.money{color:var(--money)}
.hp{color:var(--red);letter-spacing:2px}
.who{font-size:14px;color:var(--muted);font-family:system-ui,sans-serif}
.tbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.tbar i{display:block;height:100%;width:100%;background:var(--green)}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:20px;padding:2px 10px;margin-bottom:8px;border:1px solid var(--line)}
.tag.rp{color:var(--yellow);border-color:var(--yellow)}
.tag.sc{color:var(--blue);border-color:var(--blue)}
h2{font-size:21px;margin:0;line-height:1.3}
.opts{display:grid;gap:8px;margin-bottom:12px}
.opt{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.ok{background:var(--green);border-color:var(--green);color:var(--on)}
.opt.bad{background:var(--red);border-color:var(--red);color:var(--on)}
.opt.gone{opacity:.25}
.opt:disabled{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{font-size:16px;border:0;border-radius:12px;background:var(--green);color:var(--on);padding:12px 18px;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.chat{background:var(--chat);color:#E8E8E8;border-radius:12px;padding:10px 12px;font:14px/1.5 ui-monospace,Consolas,Menlo,monospace;min-height:96px}
.chat div{overflow-wrap:anywhere}
.big{font-size:40px;margin:6px 0}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="pick">
    <h1>Курант RP</h1>
    <p class="sub">Викторина про школу и SAMP RP. Выберите героя и ответьте на 10 вопросов. Три ошибки, и вы возвращаетесь на спавн.</p>
    <div class="hero" id="heroes"></div>
    <p class="sub" id="best" style="margin-top:16px"></p>
  </section>

  <section id="game" hidden>
    <div class="hud"><span class="money" id="money"></span><span class="hp" id="hp"></span></div>
    <div class="who" id="who"></div>
    <div class="tbar"><i id="tfill"></i></div>
    <div class="qbox"><span class="tag" id="tag"></span><h2 id="q"></h2></div>
    <div class="opts" id="opts"></div>
    <div class="row">
      <button class="btn alt" id="ab" type="button"></button>
      <button class="btn" id="next" type="button" hidden>Дальше</button>
    </div>
    <div class="chat" id="chat"></div>
  </section>

  <section id="end" hidden>
    <h1 id="rank"></h1>
    <div class="hud big"><span class="money" id="final"></span></div>
    <p class="sub" id="endtext"></p>
    <div class="row">
      <button class="btn" id="again" type="button">Играть снова</button>
      <button class="btn alt" id="change" type="button">Сменить героя</button>
    </div>
  </section>
</main>
<script>
(function(){
  var CH = [
    {n:'Марина Курант', e:'💁‍♀️', ab:'50/50', d:'Убирает два неверных ответа'},
    {n:'Саша Курант', e:'😎', ab:'Пропуск', d:'Пропускает вопрос без потери жизни'},
    {n:'Андрей Курант', e:'🧢', ab:'Аптечка', d:'Возвращает одну жизнь'}
  ];
  var S='Школа', R='SAMP RP';
  var Q = [
    [S,'7 × 8 = ?',['56','54','58','64']],
    [S,'Какая столица Австралии?',['Канберра','Сидней','Мельбурн','Перт']],
    [S,'Сколько планет в Солнечной системе?',['8','7','9','10']],
    [S,'Чему равен квадратный корень из 144?',['12','10','11','14']],
    [S,'Какая химическая формула воды?',['H₂O','CO₂','O₂','NaCl']],
    [S,'Кто написал «Евгений Онегин»?',['Пушкин','Лермонтов','Толстой','Гоголь']],
    [S,'В каком году началась Великая Отечественная война?',['1941','1939','1943','1945']],
    [S,'Чему равна сумма углов треугольника?',['180°','90°','270°','360°']],
    [S,'Какой океан самый большой?',['Тихий','Атлантический','Индийский','Северный Ледовитый']],
    [S,'Какой газ растения выделяют при фотосинтезе?',['Кислород','Азот','Углекислый газ','Водород']],
    [S,'Какая часть речи отвечает на вопрос «что делать?»',['Глагол','Существительное','Прилагательное','Наречие']],
    [S,'Чему равна площадь прямоугольника 6 на 4?',['24','10','20','48']],
    [R,'Что означает DM в правилах RP?',['Убийство или урон без IC-причины','Дружеский матч','Двойная миссия','Диалог с мэром']],
    [R,'Какая команда описывает действие персонажа?',['/me','/b','/ad','/gov']],
    [R,'Что значит OOC?',['Информация вне роли, от игрока','Особо опасный преступник','Официальный офис','Отыгрыш в роли']],
    [R,'Для чего обычно используют /b?',['Для OOC-чата','Для банковского перевода','Для вызова такси','Для объявления']],
    [R,'Что такое MG (метагейминг)?',['Использование OOC-информации в игре','Игра за двух персонажей','Быстрая езда','Сбор денег']],
    [R,'Что такое PG (пауэргейминг)?',['Нереальные действия или навязывание действий другим','Прокачка уровня','Покупка машины','Игра без микрофона']],
    [R,'Что такое RK (Revenge Kill)?',['Месть за свою смерть после возрождения','Рейд на корабль','Ремонт карты','Розыск курьера']],
    [R,'Что такое SK (Spawn Kill)?',['Убийство игрока на месте появления','Скин командира','Старт квеста','Скрытая камера']],
    [R,'Что такое IC?',['Всё, что происходит в роли персонажа','Игровой центр','Информация для админа','Идентификатор клиента']],
    [R,'Что означает CK?',['Окончательная смерть персонажа','Крутой клан','Карта казино','Купить кузов']],
    [R,'Что делать, если игрок нарушает правила?',['Подать жалобу администрации','Начать мстить ему','Удалить аккаунт','Нарушить правила в ответ']],
    [R,'Что такое NonRP?',['Поведение, нарушающее логику роли','Новая ролевая игра','Название сервера','Режим без чата']]
  ];
  var TIME = 20, ROUNDS = 10;
  var $ = function(id){ return document.getElementById(id); };
  var st = {}, timer = null;
  var best = 0;
  try { best = parseInt(localStorage.getItem('kurant-best') || '0', 10) || 0; } catch(e){}

  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function show(id){ ['pick','game','end'].forEach(function(s){ $(s).hidden = (s!==id); }); }
  function fmt(n){ return '$' + n.toLocaleString('ru-RU'); }
  function say(text, color){
    var c = $('chat'), d = document.createElement('div');
    d.textContent = text; if (color) d.style.color = color;
    c.appendChild(d); while (c.children.length > 4) c.removeChild(c.firstChild);
  }

  function buildPick(){
    var box = $('heroes'); box.textContent = '';
    CH.forEach(function(c, i){
      var b = document.createElement('button'); b.type='button'; b.className='card';
      b.innerHTML = '<div class="av">'+c.e+'</div><div><b>'+c.n+'</b><span>Способность «'+c.ab+'»: '+c.d+'</span></div>';
      b.addEventListener('click', function(){ start(i); });
      box.appendChild(b);
    });
    $('best').textContent = best ? 'Ваш рекорд: ' + fmt(best) : '';
    show('pick');
  }

  function start(i){
    st = { ch:i, hp:3, money:0, i:0, used:false, locked:false, left:TIME, pool:shuffle(Q).slice(0, ROUNDS) };
    $('chat').textContent = '';
    say('[Сервер] ' + CH[i].n + ' появляется в Лос-Сантосе.', '#7BD24A');
    hud(); show('game'); ask();
  }

  function hud(){
    $('money').textContent = fmt(st.money);
    $('hp').textContent = '♥'.repeat(st.hp) + '♡'.repeat(3 - st.hp);
    $('who').textContent = CH[st.ch].n + ' · вопрос ' + (st.i + 1) + ' из ' + ROUNDS;
    var ab = $('ab'); ab.textContent = 'Способность: ' + CH[st.ch].ab;
    ab.disabled = st.used || st.locked || (st.ch === 2 && st.hp >= 3);
  }

  function ask(){
    var q = st.pool[st.i];
    st.opts = shuffle(q[2].map(function(t, k){ return {t:t, ok:k===0}; }));
    $('tag').textContent = q[0]; $('tag').className = 'tag ' + (q[0]===R ? 'rp' : 'sc');
    $('q').textContent = q[1];
    var box = $('opts'); box.textContent = '';
    st.opts.forEach(function(o, k){
      var b = document.createElement('button'); b.type='button'; b.className='opt'; b.textContent = o.t;
      b.addEventListener('click', function(){ answer(k); });
      o.el = b; box.appendChild(b);
    });
    st.locked = false; $('next').hidden = true; hud();
    st.left = TIME; clearInterval(timer);
    timer = setInterval(function(){
      st.left -= 0.1; $('tfill').style.width = Math.max(0, st.left / TIME * 100) + '%';
      $('tfill').style.background = st.left < 6 ? 'var(--red)' : 'var(--green)';
      if (st.left <= 0) answer(-1);
    }, 100);
  }

  function answer(k){
    if (st.locked) return;
    st.locked = true; clearInterval(timer);
    st.opts.forEach(function(o){ o.el.disabled = true; if (o.ok) o.el.classList.add('ok'); });
    if (k >= 0 && st.opts[k].ok) {
      var gain = 500 + Math.ceil(st.left) * 10;
      st.money += gain;
      say('[Сервер] Верно! Вы получили ' + fmt(gain) + '.', '#7BD24A');
    } else {
      if (k >= 0) st.opts[k].el.classList.add('bad');
      st.hp--;
      say(k < 0 ? '[Сервер] Время вышло. Вы теряете здоровье.' : '[Сервер] Неверно. Вы теряете здоровье.', '#FF6B5E');
    }
    hud(); $('next').hidden = false; $('next').textContent = (st.hp <= 0 || st.i >= ROUNDS - 1) ? 'Результат' : 'Дальше'; $('next').focus();
  }

  function useAbility(){
    if (st.used || st.locked) return;
    if (st.ch === 0) {
      var bad = shuffle(st.opts.filter(function(o){ return !o.ok; })).slice(0, 2);
      bad.forEach(function(o){ o.el.disabled = true; o.el.classList.add('gone'); });
      say('[Марина] Два варианта точно не подходят.', '#F2B93B');
    } else if (st.ch === 1) {
      st.used = true; clearInterval(timer); say('[Саша] Пропускаем этот вопрос.', '#F2B93B');
      return advance(true);
    } else {
      if (st.hp >= 3) return;
      st.hp++; say('[Андрей] Использует аптечку. +1 жизнь.', '#F2B93B');
    }
    st.used = true; hud();
  }

  function advance(skipped){
    if (!skipped && (st.hp <= 0 || st.i >= ROUNDS - 1)) return finish();
    if (skipped && st.i >= ROUNDS - 1) return finish();
    st.i++; ask();
  }

  function finish(){
    clearInterval(timer);
    var m = st.money, dead = st.hp <= 0;
    var rank = dead ? 'Респавн в больнице' : m >= 6500 ? 'Легенда сервера' : m >= 4500 ? 'Лидер фракции' : m >= 2500 ? 'Житель Лос-Сантоса' : 'Новичок на спавне';
    $('rank').textContent = rank; $('final').textContent = fmt(m);
    if (m > best) { best = m; try { localStorage.setItem('kurant-best', String(m)); } catch(e){} }
    $('endtext').textContent = CH[st.ch].n + (dead ? ' потерял все жизни.' : ' прошёл все вопросы.') + ' Рекорд: ' + fmt(best) + '.';
    show('end');
  }

  $('next').addEventListener('click', function(){ advance(false); });
  $('ab').addEventListener('click', useAbility);
  $('again').addEventListener('click', function(){ start(st.ch); });
  $('change').addEventListener('click', buildPick);
  buildPick();
})();
</script>
</body>
</html>
