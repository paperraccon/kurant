<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLEEP CITY VI — Трекер сна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff2d78; --magenta:#c026d3; --purple:#7c3aed; --cyan:#22d3ee;
  --orange:#fb923c; --yellow:#facc15; --green:#34d399; --red:#f43f5e;
  --bg:#0b0518; --panel:rgba(22,9,48,.78); --panel2:rgba(34,12,70,.65);
  --border:rgba(255,45,120,.35); --text:#f5e9ff; --muted:#b9a8d9;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(124,58,237,.35), transparent 60%),
    radial-gradient(800px 500px at -10% 10%, rgba(255,45,120,.22), transparent 60%),
    radial-gradient(1000px 600px at 50% 110%, rgba(34,211,238,.14), transparent 60%),
    linear-gradient(165deg,#0b0518 0%,#170a33 35%,#2a0a52 65%,#0b0518 100%);
  background-attachment:fixed;
}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 3px);opacity:.5}
#app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:0 16px}

/* ===== BANNER ===== */
#banner{position:relative;border-radius:0 0 22px 22px;overflow:hidden;
  background:linear-gradient(180deg,#1b0736 0%,#4c1d95 45%,#a21caf 72%,#ff5e78 100%);
  border:1px solid var(--border);border-top:none;box-shadow:0 0 60px rgba(255,45,120,.35)}
#banner .sun{position:absolute;left:50%;top:34%;width:340px;height:340px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#fff3b0 0%,#ffb347 35%,#ff5e78 60%,transparent 72%);
  opacity:.55;filter:blur(2px);pointer-events:none}
#banner .grid{position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,45,120,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.5) 1px,transparent 1px);
  background-size:60px 60px;mask-image:linear-gradient(180deg,transparent 40%,black 100%);-webkit-mask-image:linear-gradient(180deg,transparent 40%,black 100%)}
#banner .inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px 26px 30px}
.logo{line-height:1}
.logo .l1{font-family:'Russo One',sans-serif;font-size:clamp(26px,4vw,44px);letter-spacing:.35em;color:#fff;
  text-shadow:0 0 8px #ff2d78,0 0 24px #ff2d78,0 0 60px rgba(255,45,120,.7)}
.logo .l2{display:flex;align-items:baseline;gap:14px;margin-top:2px}
.logo .vi{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
  font-size:clamp(40px,6.5vw,72px);
  background:linear-gradient(180deg,#ffe259 0%,#ff8a3d 40%,#ff2d78 75%,#c026d3 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,45,120,.85))}
.logo .sub{color:#ffe3f1;font-size:13px;letter-spacing:.4em;text-transform:uppercase;opacity:.9;
  text-shadow:0 0 10px rgba(34,211,238,.9)}

/* ===== NAV ===== */
#topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 14px;margin-top:14px;border-radius:14px;
  background:rgba(14,5,32,.85);backdrop-filter:blur(10px);border:1px solid var(--border);
  box-shadow:0 4px 30px rgba(192,38,211,.25)}
.navbtn{cursor:pointer;border:1px solid transparent;background:transparent;color:#e9d5ff;
  font-family:'Russo One',sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border-radius:9px;transition:.2s}
.navbtn:hover{background:rgba(255,45,120,.15);border-color:var(--border);box-shadow:0 0 14px rgba(255,45,120,.4)}
.navbtn.active{background:linear-gradient(135deg,#ff2d78,#7c3aed);color:#fff;box-shadow:0 0 18px rgba(255,45,120,.65)}
.navbtn .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;box-shadow:0 0 8px rgba(244,63,94,.8)}
#autharea{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;cursor:pointer;
  font-size:14px;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:0 0 12px rgba(255,45,120,.7)}
#userchip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel)}
#userchip:hover{box-shadow:0 0 14px rgba(255,45,120,.4)}
#userchip .nick{font-weight:600;font-size:13px}

/* ===== COMMON ===== */
h1{font-family:'Russo One',sans-serif;font-size:clamp(22px,3.4vw,34px);margin:26px 0 6px;
  background:linear-gradient(90deg,#7ef0ff,#ff2d78 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,45,120,.5))}
h2{font-family:'Russo One',sans-serif;font-size:19px;margin:18px 0 10px;color:#ffe3f1;text-shadow:0 0 10px rgba(255,45,120,.5)}
.sub-line{color:var(--muted);margin-bottom:16px;font-size:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;
  box-shadow:0 0 24px rgba(124,58,237,.18), inset 0 0 40px rgba(11,5,24,.4);backdrop-filter:blur(8px)}
.btn{cursor:pointer;border:none;border-radius:10px;padding:10px 18px;font-weight:700;font-size:14px;color:#fff;
  font-family:'Inter',sans-serif;background:linear-gradient(135deg,#ff2d78,#7c3aed);
  box-shadow:0 0 14px rgba(255,45,120,.5);transition:.18s;letter-spacing:.03em}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 26px rgba(255,45,120,.85)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-cyan{background:linear-gradient(135deg,#22d3ee,#2563eb);box-shadow:0 0 14px rgba(34,211,238,.5)}
.btn-cyan:hover{box-shadow:0 0 26px rgba(34,211,238,.85)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#e9d5ff;box-shadow:none}
.btn-ghost:hover{background:rgba(255,45,120,.12);box-shadow:0 0 12px rgba(255,45,120,.35)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#7f1d1d);box-shadow:0 0 14px rgba(244,63,94,.5)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
input,select,textarea{background:rgba(11,5,24,.75);border:1px solid rgba(124,58,237,.5);border-radius:9px;color:#fff;
  padding:10px 12px;font-size:14px;font-family:inherit;width:100%;outline:none;transition:.2s}
input:focus,select,textarea:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 12px rgba(255,45,120,.45)}
input[type="time"]{color-scheme:dark}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.05em;text-transform:uppercase}
.badge{display:inline-block;padding:2px 9px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em}
.badge-admin{background:linear-gradient(135deg,#fbbf24,#b45309);color:#1a0b00;box-shadow:0 0 10px rgba(251,191,36,.6)}
.badge-mod{background:linear-gradient(135deg,#22d3ee,#1d4ed8);color:#04121f;box-shadow:0 0 10px rgba(34,211,238,.6)}
.badge-user{background:rgba(255,45,120,.25);color:#ffd6e7;border:1px solid var(--border)}
.badge-ban{background:linear-gradient(135deg,#f43f5e,#7f1d1d);color:#fff}
.nicklink{cursor:pointer;color:#7ef0ff;font-weight:600;text-decoration:none}
.nicklink:hover{text-shadow:0 0 10px rgba(34,211,238,.9)}
.rep{color:#34d399;font-weight:700;font-size:12px;text-shadow:0 0 8px rgba(52,211,153,.6)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.error{color:#fda4af;font-size:13px;margin-top:8px;min-height:16px}
.ok{color:#6ee7b7;font-size:13px;margin-top:8px;min-height:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 22px;border-radius:12px;pointer-events:none;
  background:linear-gradient(135deg,#ff2d78,#7c3aed);color:#fff;font-weight:600;box-shadow:0 0 30px rgba(255,45,120,.7);animation:fade 2s forwards}
@keyframes fade{0%{opacity:0;transform:translate(-50%,12px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:14px;text-align:center}
.stat .num{font-family:'Russo One',sans-serif;font-size:26px;color:#7ef0ff;text-shadow:0 0 14px rgba(34,211,238,.7)}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}

/* ===== XP / LEVEL ===== */
.levelbar{position:relative;height:22px;border-radius:11px;overflow:hidden;background:rgba(11,5,24,.8);border:1px solid var(--border)}
.levelbar .fill{height:100%;border-radius:11px;background:linear-gradient(90deg,#ff2d78,#c026d3,#22d3ee);
  box-shadow:0 0 20px rgba(255,45,120,.8);transition:width .6s;min-width:2%}
.levelbar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.rank{font-family:'Russo One',sans-serif;font-size:20px;
  background:linear-gradient(90deg,#ffe259,#ff2d78,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,45,120,.7))}

/* ===== CALENDAR ===== */
.yearnav{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 18px}
.yearnav .ynum{font-family:'Russo One',sans-serif;font-size:30px;color:#fff;text-shadow:0 0 16px rgba(34,211,238,.8)}
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
.month{background:var(--panel2);border:1px solid rgba(124,58,237,.4);border-radius:12px;padding:12px}
.month h3{font-family:'Russo One',sans-serif;font-size:14px;color:#ffd6e7;text-align:center;margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
  background:rgba(11,5,24,.6);border:1px solid rgba(124,58,237,.25);color:#cbb8ec;transition:.15s}
.day:hover{border-color:var(--pink);box-shadow:0 0 10px rgba(255,45,120,.55);transform:scale(1.08)}
.day.full{background:linear-gradient(135deg,#c026d3,#ff2d78);color:#fff;box-shadow:0 0 10px rgba(255,45,120,.6);font-weight:700}
.day.part{background:rgba(124,58,237,.5);color:#fff}
.day.today{border:2px solid var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.7)}
.day.empty{visibility:hidden}
.legend{display:flex;gap:18px;justify-content:center;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

/* ===== MESSAGES ===== */
.msgs-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:400px}
@media(max-width:820px){.msgs-wrap{grid-template-columns:1fr}}
.dlg{padding:10px 12px;border-radius:10px;border:1px solid rgba(124,58,237,.3);cursor:pointer;margin-bottom:8px;background:var(--panel2)}
.dlg:hover,.dlg.active{border-color:var(--pink);box-shadow:0 0 12px rgba(255,45,120,.4)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:6px}
.bub{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#ff2d78,#c026d3);border-bottom-right-radius:4px;box-shadow:0 0 12px rgba(255,45,120,.45)}
.bub.them{align-self:flex-start;background:var(--panel2);border:1px solid rgba(124,58,237,.5);border-bottom-left-radius:4px}
.bub .tm{display:block;font-size:10px;opacity:.7;margin-top:4px}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(5,1,14,.8);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:linear-gradient(160deg,#1d0b3d,#2b0a4e);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:440px;
  box-shadow:0 0 60px rgba(255,45,120,.4)}
.modal h3{font-family:'Russo One',sans-serif;margin-bottom:6px;color:#ffd6e7}
.modal .mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

/* ===== TABLE ===== */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:#7ef0ff;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid rgba(124,58,237,.2)}
tr:hover td{background:rgba(255,45,120,.06)}

/* ===== NEWS ===== */
.news{border-left:3px solid var(--pink);padding-left:14px;margin-bottom:18px}
.news .nt{font-family:'Russo One',sans-serif;color:#ffd6e7;margin-bottom:4px}
.news .nd{font-size:11px;color:var(--muted);margin-bottom:6px}

/* ===== MISC ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{cursor:pointer;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid rgba(124,58,237,.4);background:var(--panel2);color:#e9d5ff}
.tab.active{background:linear-gradient(135deg,#22d3ee,#2563eb);color:#fff;box-shadow:0 0 14px rgba(34,211,238,.6)}
pre{background:rgba(5,1,14,.7);border:1px solid rgba(34,211,238,.35);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;color:#7ef0ff;line-height:1.5}
.gta-note{background:rgba(250,146,60,.12);border:1px solid rgba(251,146,60,.4);border-radius:10px;padding:10px 14px;font-size:13px;color:#ffedd5;margin:10px 0}
.big-cta{font-family:'Russo One',sans-serif;font-size:16px;padding:14px 30px;border-radius:12px;letter-spacing:.05em}
footer{margin:40px 0 20px;text-align:center;color:var(--muted);font-size:12px}
footer .flogo{font-family:'Russo One',sans-serif;letter-spacing:.3em;color:#ff2d78;text-shadow:0 0 10px rgba(255,45,120,.6)}

/* статус, контакты */
.statusdot{position:absolute;right:-4px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg)}
.status-awake{background:var(--green);box-shadow:0 0 8px rgba(52,211,153,.8)}
.status-sleep{background:var(--purple);box-shadow:0 0 8px rgba(167,139,250,.8)}
.status-dnd{background:var(--red);box-shadow:0 0 8px rgba(244,63,94,.8)}
.statustxt{font-size:13px;color:var(--muted)}
.bio{margin-top:6px;opacity:.9}
.switch{width:64px;height:32px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--border);position:relative;cursor:pointer;transition:.2s;touch-action:none;user-select:none;display:inline-block}
.switch.on{background:linear-gradient(90deg,var(--purple),var(--magenta));box-shadow:0 0 14px rgba(192,38,211,.6)}
.switch .knob{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.switch.on .knob{left:34px}
.hint-y{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.4);border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#fde68a}

/* ====== ПРОФИЛЬ (samp-структура, палитра Вайс-Сити) ====== */
.sp-grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.sp-grid{grid-template-columns:1fr}}
.sp-left,.sp-block{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 0 24px rgba(255,45,120,.12),inset 0 0 30px rgba(124,58,237,.08)}
.sp-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.sp-ring{position:relative;width:112px;height:112px;flex:none;margin-bottom:6px}
.sp-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.sp-ring .avatar{position:absolute;inset:10px;width:92px;height:92px;font-size:34px;border-radius:50%}
.sp-nick{font-size:24px;font-weight:800;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-lbl{color:var(--muted);font-size:13px;margin-top:10px}
.sp-val{font-size:16px;font-weight:700}
.sp-coins{margin-top:16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:10px 14px}
.sp-coins b{color:var(--yellow)}
.sp-plus{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--pink),var(--magenta));color:#fff;font-size:18px;box-shadow:0 0 14px rgba(255,45,120,.5);cursor:pointer;flex:none}
.sp-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sp-menu a{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px 8px;color:var(--text);text-decoration:none;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:center}
.sp-menu a:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.25)}
.sp-menu a span{font-size:22px}
.sp-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.sp-cols{grid-template-columns:1fr}}
.sp-big{background:var(--panel2);border:1px solid rgba(34,211,238,.25);border-radius:16px;padding:16px;box-shadow:0 0 20px rgba(34,211,238,.08)}
.sp-big .lbl{color:var(--muted);font-size:13px}
.sp-big .val{font-size:22px;font-weight:800;margin-top:4px;color:var(--cyan)}
.sp-big .sub{color:var(--muted);font-size:12px;margin-top:2px}
.sp-skills{margin-top:16px}
.sp-skills h3{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.sp-skill{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:10px}
.sp-skill .nm{font-weight:700;font-size:14px}
.sp-skill .pc{color:var(--cyan);font-weight:700;font-size:13px}
.sp-bar{grid-column:1/3;height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.sp-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.sp-app{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:12px}
.sp-app .ic{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px}
.sp-lvl{font-size:10px;background:linear-gradient(135deg,var(--pink),var(--magenta));padding:2px 7px;border-radius:7px;font-weight:700}
/* экран входа */
.authwrap{max-width:440px;margin:26px auto 60px}
.authcard{background:rgba(23,10,36,.94);border:1px solid var(--border);border-radius:18px;padding:26px;box-shadow:0 0 40px rgba(255,45,120,.22)}
.authsub{text-align:center;color:var(--muted);margin:4px 0 18px}
.authtabs{display:flex;gap:8px;margin-bottom:18px}
.authtab{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
.authtab:hover{color:var(--text);border-color:var(--pink)}
.authtab.active{background:var(--pink);color:#fff;border-color:var(--pink)}

</style>
</head>
<body>
<div id="app">
  <header id="banner">
    <div class="sun"></div><div class="grid"></div>
    <div class="inner">
      <div class="logo">
        <div class="l1">SLEEP CITY</div>

/* ============ XP И СТАТИСТИКА ============ */
function sleepHours(rec){
  if(!rec||!rec.s||!rec.w) return null;
  const [sh,sm]=rec.s.split(':').map(Number), [wh,wm]=rec.w.split(':').map(Number);
  let dur=(wh*60+wm)-(sh*60+sm); if(dur<=0) dur+=1440;
  return dur/60;
}
function xpForNight(rec){
  const h=sleepHours(rec); if(h==null) return 0;
  let xp = h>=8 ? 1 : Math.max(0,(h-4)*0.25);
  const [sh,sm]=rec.s.split(':').map(Number); const mins=sh*60+sm;
  const late=mins-(23*60+30);
  if(late>0) xp-=Math.floor(late/60)*0.5;
  if(h>10) xp-=(h-10)*0.15;
  return Math.max(0, Math.round(Math.min(1,xp)*100)/100);
}
function userXp(uidv){ const recs=(DB.sleep[uidv]||{}); let xp=0; for(const k in recs){ xp+=xpForNight(recs[k]); } return Math.round(Math.min(30,xp)*100)/100; }
function levelOf(xp){ return Math.min(9, Math.floor(xp/3)); }
function repOf(uidv){ return 0; }
function statsOf(uidv){
  const recs=DB.sleep[uidv]||{}; const days=Object.keys(recs).length;
  if(!days) return {days:0,avg:0,streak:0,week7:0,perfect:0};
  let sum=0,n=0,perfect=0,week7=0;
  for(const k in recs){ const h=sleepHours(recs[k]); if(h==null) continue; sum+=h; n++; if(h>=8&&xpForNight(recs[k])>=1) perfect++; if(h>=7) week7++; }
  const avg=n?sum/n:0;
  // серия: подряд идущие дни с записями, начиная с сегодня или вчера
  let streak=0; const d=new Date(); if(!recs[todayStr()]) d.setDate(d.getDate()-1);
  while(recs[d.toISOString().slice(0,10)]){ streak++; d.setDate(d.getDate()-1); }
  return {days,avg,streak,week7,perfect};
}

function routeToHash(){
  if(PAGE==='profile'&&PAGEPARAM) return '#/profile/'+PAGEPARAM;

}
function parseHash(){
  const h=location.hash||''; if(h.indexOf('#/')!==0) return null;
  const parts=h.slice(2).split('/'); const id=parts[0];
  if(id==='profile'&&parts[1]) return ['profile',parts[1]];
  if(id==='msgs'&&parts[1]) return ['msgs',parts[1]];
  if(id==='sleep'&&parts[1]) return ['tracker',parts[1]];
  if(PAGE_HASH[id]) return [id,null];
  return null;
}
window.addEventListener('hashchange',()=>{
  if(suppressHash){ suppressHash=false; return; }
  const r=parseHash(); if(r){ PAGE=r[0]; PAGEPARAM=r[1]; } else { PAGE='home'; PAGEPARAM=null; }
  window.scrollTo(0,0); renderPage();
});

function setChartMode(days){ window.chartDays=days; document.getElementById('tab30').classList.toggle('active',days===30);
  document.getElementById('tab365').classList.toggle('active',days===365); drawChart(PAGEPARAM||ME.id); }
function monthHtml(y,m,recs,readOnly){
  const first=new Date(y,m,1); let skip=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate(); let cells='';
  for(let i=0;i<skip;i++) cells+='<span class="day empty"></span>';
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const rec=recs[ds]; const isToday=ds===todayStr();
    let cls='day'; if(rec&&rec.s&&rec.w) cls+=' full'; else if(rec) cls+=' part'; if(isToday) cls+=' today';
    cells+='<span class="'+cls+'" onclick="dayClick(\''+ds+'\','+(readOnly?'true':'false')+')">'+d+'</span>';
  }
  return '<div class="month"><h3>'+MONTHS[m]+' '+y+'</h3><div class="dow"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days">'+cells+'</div></div>';
}
function dayClick(ds,readOnly){
  const uidv=PAGEPARAM||ME.id;
  const rec=(DB.sleep[uidv]||{})[ds]||{};
  if(readOnly){
    const h=sleepHours(rec);
    modal('<h3>📅 '+ds+'</h3>'+(rec.s||rec.w?
      '<p>Отбой: <b>'+(rec.s||'—')+'</b><br>Подъём: <b>'+(rec.w||'—')+'</b><br>Сон: <b>'+(h?h.toFixed(1)+' ч':'—')+'</b> • XP: <b>'+xpForNight(rec)+'</b></p>'
      :'<p class="muted">В этот день записей нет</p>')+
      '<div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>');
    return;
  }
  modal('<h3>📅 '+ds+'</h3><p class="muted">Отметь свой сон, легенда</p>'+
    '<div class="mrow"><div><label>🌙 Лёг спать</label><input type="time" id="sl-s" value="'+(rec.s||'')+'"></div>'+
    '<div><label>☀️ Проснулся</label><input type="time" id="sl-w" value="'+(rec.w||'')+'"></div></div>'+
    '<div class="modal-actions"><button class="btn" onclick="saveDay(\''+ds+'\')">💾 Сохранить</button>'+
    '<button class="btn-danger btn" onclick="delDay(\''+ds+'\')">🗑 Удалить</button>'+
    '<button class="btn-ghost btn" onclick="closeModal()">Закрыть</button></div>');
}
async function saveDay(ds){
  const uidv=PAGEPARAM||ME.id;
  if(!DB.sleep[uidv]) DB.sleep[uidv]={};
  DB.sleep[uidv][ds]={s:document.getElementById('sl-s').value,w:document.getElementById('sl-w').value};
  await saveSleep(uidv); closeModal(); renderPage(); toast('Записано! Сон на '+ds);
}
async function delDay(ds){
  const uidv=PAGEPARAM||ME.id;
  if(DB.sleep[uidv]) delete DB.sleep[uidv][ds];

}
async function clearYear(){
  const uidv=PAGEPARAM||ME.id;
  if(!confirm('Удалить все записи за '+year+' год?')) return;
  if(DB.sleep[uidv]) for(const k of Object.keys(DB.sleep[uidv])) if(k.startsWith(year+'-')) delete DB.sleep[uidv][k];
  await saveSleep(uidv); renderPage(); toast('Год очищен');
}
function exportCSV(){
  const uidv=PAGEPARAM||ME.id; const recs=DB.sleep[uidv]||{};
  let csv='Дата;Лёг спать;Проснулся;Часов сна;XP\n';
  for(const k of Object.keys(recs).sort()){ const r=recs[k]; const h=sleepHours(r);
    csv+=k+';'+(r.s||'')+';'+(r.w||'')+';'+(h?h.toFixed(2):'')+';'+xpForNight(r)+'\n'; }
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sleep_'+year+'.csv'; a.click(); toast('CSV сохранён');
}

/* ============ ДИАГРАММА ============ */
function drawChart(uidv){
  const cv=document.getElementById('chart'); if(!cv) return;
  const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=300;
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const recs=DB.sleep[uidv]||{}; const mode=window.chartDays||30;
  let data=[];
  if(mode===30){ for(let i=29;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    const h=sleepHours(recs[ds]); data.push({label:ds.slice(5),h,s:recs[ds]?recs[ds].s:null}); } }
  else{ const ym=String(year); for(let m=0;m<12;m++){ let sum=0,n=0;
    for(let d=1;d<=31;d++){ const ds=ym+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); if(!recs[ds]) continue; const h=sleepHours(recs[ds]); if(h==null) continue; sum+=h; n++; }
    data.push({label:MONTHS[m].slice(0,3),h:n?sum/n:null,n}); } }
  const maxH=Math.max(10,...data.map(d=>d.h||0),9)+1;
  const padL=34,padB=28,padT=16,plotW=W-padL-10,plotH=H-padT-padB;
  // сетка
  ctx.strokeStyle='rgba(124,58,237,.3)'; ctx.fillStyle='#b9a8d9'; ctx.font='10px Inter'; ctx.textAlign='right';
  const stepH=Math.ceil(maxH/5);
  for(let g=0;g<=5;g++){ const v=g*stepH; const y=padT+plotH-(v/maxH)*plotH;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-10,y); ctx.stroke(); ctx.fillText(v+'ч',padL-6,y+3); }
  // линия нормы 8ч
  const ny=padT+plotH-(8/maxH)*plotH;
  ctx.strokeStyle='rgba(255,45,120,.9)'; ctx.setLineDash([6,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(padL,ny); ctx.lineTo(W-10,ny); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,45,120,.9)'; ctx.textAlign='left'; ctx.fillText('норма 8ч',padL+4,ny-5);
  // столбики
  const bw=plotW/data.length;
  data.forEach((d,i)=>{
    if(d.h==null) return;
    const x=padL+i*bw+bw*0.15, w=bw*0.7;
    const bh=(d.h/maxH)*plotH, y=padT+plotH-bh;
    const grad=ctx.createLinearGradient(0,y,0,y+bh);
    if(d.h>=8){ grad.addColorStop(0,'#34d399'); grad.addColorStop(1,'rgba(52,211,153,.25)'); }
    else if(d.h>=7){ grad.addColorStop(0,'#facc15'); grad.addColorStop(1,'rgba(250,204,21,.25)'); }
    else{ grad.addColorStop(0,'#f43f5e'); grad.addColorStop(1,'rgba(244,63,94,.25)'); }
    ctx.fillStyle=grad; ctx.shadowColor=d.h>=8?'rgba(52,211,153,.8)':d.h>=7?'rgba(250,204,21,.8)':'rgba(244,63,94,.8)'; ctx.shadowBlur=8;
    ctx.beginPath(); if(ctx.roundRect){ ctx.roundRect(x,y,w,bh,4); ctx.fill(); } else { ctx.fillRect(x,y,w,bh); } ctx.shadowBlur=0;
    // подписи
    if(mode===30){ if(data.length>15?(i%5===0):true){ ctx.fillStyle='#b9a8d9'; ctx.textAlign='center'; ctx.font='9px Inter'; ctx.fillText(d.label,x+w/2,H-8); } }
    else{ ctx.fillStyle='#b9a8d9'; ctx.textAlign='center'; ctx.font='10px Inter'; ctx.fillText(d.label,x+w/2,H-8); }
  });
  // тултип по клику
  cv.onclick=(ev)=>{
    const rect=cv.getBoundingClientRect(); const mx=ev.clientX-rect.left;
    const i=Math.floor((mx-padL)/bw);
    if(i<0||i>=data.length||data[i].h==null) return;
    const d=data[i];
    toast(d.label+': сон '+(mode===30?'':'в среднем ')+' '+d.h.toFixed(1)+' ч'+(d.s?' (отбой '+d.s+')':''));
  };
}
</script>

function renderThread(p,pid){

async function togglePrivacy(){

/* ============ АДМИН-ПАНЕЛЬ ============ */
let A_TAB='users', A_VIEW=null;
function renderAdmin(p){

  if(A_TAB==='users'){
    body='<table><tr><th>Игрок</th><th>Роль</th><th>Сон</th><th>Действия</th></tr>';

      body+='<tr><td><span class="nicklink" onclick="showPage(\'profile\',\''+u.id+'\')">'+esc(u.nick)+'</span><div class="muted">'+esc(u.email)+'</div></td>'+
      '<td><span class="badge badge-'+(u.banned?'ban':u.role)+'">'+(u.banned?'БАН':roleName(u.role))+'</span></td>'+
      '<td>'+Object.keys(DB.sleep[u.id]||{}).length+' дн.</td>'+

      (u.role==='user'?'<button class="btn-ghost btn btn-sm" onclick="setRole(\''+u.id+'\',\'user\')">Юзер</button>':'')+
      (u.id!==ME.id?'<button class="btn-danger btn btn-sm" onclick="toggleBan(\''+u.id+'\')">'+(u.banned?'Разбан':'Бан')+'</button><button class="btn-danger btn btn-sm" onclick="delUser(\''+u.id+'\')">Удалить</button>':'')+
      '<button class="btn-ghost btn btn-sm" onclick="adminSetPass(\''+u.id+'\')">🔑 Пароль</button>'+
      '<button class="btn-cyan btn btn-sm" onclick="adminViewSleep(\''+u.id+'\')">👁 Сон</button></div></td></tr>';
    }
    body+='</table>';
  } else if(A_TAB==='sleep'){
    if(A_VIEW){ const u=DB.users.find(x=>x.id===A_VIEW);
      const recs=DB.sleep[A_VIEW]||{}; const ks=Object.keys(recs).sort().reverse().slice(0,60);
      body='<div class="row"><button class="btn btn-ghost btn-sm" onclick="A_VIEW=null;renderPage()">← Все игроки</button><b>Сон игрока '+esc(u?u.nick:'')+'</b></div><div style="height:10px"></div>';
      if(!ks.length) body+='<p class="muted">Записей нет.</p>';
      else { body+='<table><tr><th>Дата</th><th>Отбой</th><th>Подъём</th><th>Часов</th><th>XP</th></tr>';
        for(const k of ks){ const r=recs[k],h=sleepHours(r); body+='<tr><td>'+k+'</td><td>'+(r.s||'—')+'</td><td>'+(r.w||'—')+'</td><td>'+(h?h.toFixed(1):'—')+'</td><td>'+xpForNight(r)+'</td></tr>'; }
        body+='</table><div style="height:14px"></div><button class="btn-danger btn" onclick="eraseSleep(\''+A_VIEW+'\')">🗑 Стереть ВСЕ записи сна этого игрока</button>'; }
    } else {
      body='<table><tr><th>Игрок</th><th>Записей</th><th>XP</th><th>Приватность</th><th></th></tr>';
      for(const u of DB.users){
        body+='<tr><td>'+esc(u.nick)+'</td><td>'+Object.keys(DB.sleep[u.id]||{}).length+'</td><td>'+userXp(u.id)+'</td>'+
        '<td>'+(u.privacy?'открыт':'закрыт')+'</td><td><button class="btn-cyan btn btn-sm" onclick="A_VIEW=\''+u.id+'\';renderPage()">Открыть данные</button></td></tr>';
      }
      body+='</table><div class="gta-note">🔒 Админ видит данные сна всех игроков независимо от приватности — это полный доступ.</div>';
    }
  } else {
    body='<p>Чтобы регистрация работала по-настоящему для всех посетителей, подключите Firebase (бесплатно):</p>'+
    '<ol style="margin:12px 0 12px 20px;line-height:1.9">'+
    '<li>Зайдите на <b>console.firebase.google.com</b> и создайте проект</li>'+
    '<li>В левом меню: <b>Build → Authentication → Get started</b>, включите провайдер <b>Email/Password</b></li>'+
    '<li><b>Build → Firestore Database → Create database</b> (в режиме production)</li>'+
    '<li><b>Настройки проекта → Ваши приложения → Web app</b> — скопируйте объект firebaseConfig</li>'+
    '<li>Вставьте его в начало скрипта этого файла в строку <pre style="display:inline;padding:2px 8px">const FIREBASE_CONFIG = null</pre> — вместо null</li>'+
    '<li>Опубликуйте файл как <b>index.html</b> на GitHub Pages или Netlify Drop</li></ol>'+
    '<h2>🛡 Правила безопасности Firestore (вкладка Rules)</h2>'+
    '<pre>rules_version = \'2\';\n'+
    'service cloud.firestore {\n'+
    '  match /databases/{db}/documents {\n'+
    '    match /users/{uid} {\n'+
    '      allow read: if true;\n'+
    '      allow write: if request.auth != null && request.auth.uid == uid;\n'+
    '    }\n'+
    '    match /forum/main { allow read: if true; allow write: if request.auth != null; }\n'+
    '    match /sleep/{uid} {\n'+
    '      allow read: if request.auth != null &&\n'+
    '        (request.auth.uid == uid || get(/databases/$(db)/documents/users/$(uid)).data.privacy == true || request.auth.token.email == \''+ADMIN_EMAIL+'\');\n'+
    '      allow write: if request.auth != null && (request.auth.uid == uid || request.auth.token.email == \''+ADMIN_EMAIL+'\');\n'+
    '    }\n'+
    '  }\n'+
    '}</pre>'+
    '<div class="gta-note">Эти правила означают: свой сон видишь только ты, чужой — только если его владелец включил «разрешить просмотр», и всегда — админ ('+ADMIN_EMAIL+'). Личные сообщения чужим недоступны вовсе.</div>';
  }
  p.innerHTML='<h1>🛠 Админ-панель</h1><p class="sub-line">Полный доступ ко всем данным города. Используй с умом, босс.</p>'+
    '<div class="tabs">'+tabs.map(t=>'<span class="tab'+(A_TAB===t[0]?' active':'')+'" onclick="A_TAB=\''+t[0]+'\';A_VIEW=null;renderPage()">'+t[1]+'</span>').join('')+'</div>'+
    '<div class="card">'+body+'</div>';
}
async function setRole(id,role){ const u=DB.users.find(x=>x.id===id); u.role=role; await saveUsers(id); renderPage(); toast('Роль изменена: '+roleName(role)); }
async function toggleBan(id){ const u=DB.users.find(x=>x.id===id); u.banned=!u.banned; await saveUsers(id); renderPage(); toast(u.banned?'Игрок забанен':'Игрок разбанен'); }
async function delUser(id){
  if(!confirm('Удалить аккаунт целиком вместе со сном?')) return;
  const u=DB.users.find(x=>x.id===id); if(!u) return;
  DB.users=DB.users.filter(x=>x.id!==id); delete DB.sleep[id];
  DB.messages=DB.messages.filter(m=>m.from!==id&&m.to!==id);
  markDeleted(u.email);
  if(FBMODE){
    try{ await FB.db.collection('users').doc(id).delete(); }catch(e){}
    try{ await FB.db.collection('sleep').doc(id).delete(); }catch(e){}
  }
  try{ await saveUsers(); await saveForum(); }catch(e){ console.warn(e); toast('Не удалось сохранить: проверьте правила Firebase'); }
  if(ME&&ME.id===id){ ME=null; AUTH_TAB='login'; showPage('home'); } else renderAll();
  toast('Аккаунт удалён');
}
async function eraseSleep(id){ if(!confirm('Стереть все записи сна этого игрока?')) return; DB.sleep[id]={}; await saveSleep(id); renderPage(); toast('Записи стёрты'); }
function adminViewSleep(id){ showPage('tracker',id); }

}
function doResetDemo(){ try{ localStorage.removeItem(LSKEY); localStorage.removeItem(LSDEL); DELETED=[]; sessionStorage.removeItem('sc_session'); }catch(e){} ME=null; closeModal(); DB=seedDemo(); renderAll(); toast('Демо-данные сброшены'); }
function restoreAdmin(){ const a=DB.users.find(u=>u.email===ADMIN_EMAIL); if(a){ a.pass='admin1234'; a.role='admin'; a.banned=false; dbSaveDemo(); } }

/* ============ РЕДАКТИРОВАНИЕ ПРОФИЛЯ ============ */
function editProfileModal(){
  modal('<h3>✏️ Редактировать профиль</h3>'+
  '<label>Никнейм</label><input id="pf-nick" value="'+esc(ME.nick)+'" placeholder="любой свободный ник">'+
  '<label>Коротко о себе</label><input id="pf-bio" value="'+esc(ME.bio||'')+'" placeholder="пара слов о себе">'+
  '<p class="muted" style="margin-top:8px">Ник должен быть уникальным.</p>'+
  '<div class="modal-actions"><button class="btn" onclick="saveProfile()">Сохранить</button><button class="btn-ghost btn" onclick="closeModal()">Отмена</button></div>');
}
async function saveProfile(){
  const nick=document.getElementById('pf-nick').value.trim();
  if(nick.length<2) return toast('Ник слишком короткий');
  if(nick.toLowerCase()!==ME.nick.toLowerCase()&&DB.users.find(u=>u.nick.toLowerCase()===nick.toLowerCase())) return toast('Такой ник уже занят');
  ME.nick=nick;
  ME.bio=document.getElementById('pf-bio').value.trim();
  try{ await saveUsers(ME.id); }catch(e){ console.warn(e); return toast('Не удалось сохранить: проверьте правила Firebase'); }
  closeModal(); renderAll(); toast('Профиль обновлён');
}

/* ============ РЕЖИМ «СПИТ» (свайп или клик) ============ */
function sleepSwitchHtml(){
  const st=ME.status||'awake';
  return '<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:center">'+
  '<div><b>🌙 Режим «Спит»</b><div class="muted">Смахните переключатель или просто нажмите</div></div>'+
  '<div class="switch'+(st==='sleep'?' on':'')+'" id="sleepswitch" onclick="sleepTap()" onpointerdown="sleepDown(event)" onpointermove="sleepMove(event)"><div class="knob"></div></div>'+
  '</div><div class="row" style="margin-top:8px"><span class="statustxt">'+(st==='sleep'?'😴 Вы «спите» — статус видят другие игроки':'☀️ Вы на связи')+'</span></div></div>';
}
let _swipeX=null,_swiped=false;
function sleepDown(e){ _swipeX=e.clientX; _swiped=false; }
function sleepMove(e){ if(_swipeX===null||_swiped) return; if(Math.abs(e.clientX-_swipeX)>40){ _swiped=true; sleepTap(); } }
async function sleepTap(){
  ME.status=(ME.status==='sleep'?'awake':'sleep');
  await saveUsers(ME.id); renderAll();
  toast(ME.status==='sleep'?'😴 Статус: Спит. Сладких снов!':'☀️ Статус: На связи');
}

/* ============ АДМИН: СБРОС ПАРОЛЯ ============ */
function adminSetPass(id){
  const u=DB.users.find(x=>x.id===id);
  if(FBMODE) return alert('В Firebase-режиме пароли меняются через Firebase Console — так устроена защита Google.');
  modal('<h3>🔑 Пароль для '+esc(u.nick)+'</h3><label>Новый пароль (минимум 6 символов)</label><input id="ap-pass" type="text" placeholder="••••••••"><div class="modal-actions"><button class="btn" onclick="doAdminSetPass(\''+id+'\')">Сохранить</button><button class="btn-ghost btn" onclick="closeModal()">Отмена</button></div>');
}
async function doAdminSetPass(id){
  const u=DB.users.find(x=>x.id===id);
  const p=document.getElementById('ap-pass').value;
  if(p.length<6) return toast('Минимум 6 символов');
  u.pass=p; await saveUsers(id); closeModal(); toast('Пароль обновлён');
}

function fillLoginHint(){
  const h=document.getElementById('lg-hint'); if(!h) return;
  if(FBMODE){ h.style.display='none'; return; }
  let accs=[];
  try{ const d=dbLoadDemo(); if(d) accs=d.users.filter(u=>u.email!==ADMIN_EMAIL).map(u=>u.email); }catch(e){}
  h.innerHTML='<b>Демо-режим.</b> Админ: admin@forum.local / admin1234<br><br>'+

  '<button class="btn-ghost btn btn-sm" onclick="resetDemoData()">🧹 Сбросить демо-данные</button>'+

function seedDemo(){
  DB={users:[],messages:[],news:[],sleep:{}};
  const admin={id:uid(),email:ADMIN_EMAIL,nick:'Admin',pass:'admin1234',role:'admin',banned:false,privacy:false,createdAt:Date.now()};
  DB.users.push(admin);
  DB.news.push({id:uid(),title:'SLEEP CITY VI открыт!',text:'Город сна переходит в режим полного запуска. Отмечай отбой, качай XP и не забывай: настоящий житель Вайс-Сити спит по 8 часов. В основном.',author:admin.id,time:Date.now()});
  dbSaveDemo();
  return DB;
}
async function init(){
  window.chartDays=30;
  const r0=parseHash(); if(r0){ PAGE=r0[0]; PAGEPARAM=r0[1]; }
  if(FIREBASE_CONFIG){
    const ok=await fbInit();
    if(ok){
      await loadDeleted();
      FB.auth.onAuthStateChanged(async u=>{
        if(u){
          if(isDeleted(u.email)){ try{ await FB.auth.signOut(); }catch(e){} ME=null; return; }
          try{ await ensureUserDoc(u,u.email); await afterAuth(u.uid); }catch(e){ console.warn(e); }
        }
        else { ME=null; await loadState(); renderAll(); }
      });
      return;
    }
    console.warn('Firebase недоступен — работает демо-режим');
  }
  DB=dbLoadDemo()||seedDemo();
  if(!DB.users.find(u=>u.email===ADMIN_EMAIL)) seedDemo();
  restoreAdmin();
  const sid=sessionStorage.getItem('sc_session'); if(sid){ const u=DB.users.find(x=>x.id===sid); if(u&&!u.banned) ME=u; }
  renderAll();
}
try{ init(); }catch(e){ console.error(e); }
